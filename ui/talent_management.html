<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ringmaster — Talent Management</title>
<style>
:root{--bg:#050507;--panel:#0d0f14;--card:#121520;--text:#e8ecf3;--muted:#9aa4b6;--primary:#2f7cff;--secondary:#ff2448;--line:rgba(255,255,255,.12);--ok:#67e8a5}
body{margin:0;background:radial-gradient(circle at top right,#101728 0,var(--bg) 45%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1300px;margin:0 auto;padding:20px}
.top{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;overflow:hidden;margin-bottom:12px}.top::before,.card::before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:linear-gradient(90deg,var(--secondary),var(--primary));}
.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;overflow:hidden}
.t{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}.muted{color:var(--muted);font-size:13px}
select,input{width:100%;margin-top:6px;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0a0d14;color:var(--text)}
button{margin-top:10px;border:0;border-radius:8px;padding:10px 12px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#091018;cursor:pointer}
.ok{color:var(--ok)}
</style></head><body><div class="wrap"><section class="top"><h1 style="margin:0">Talent Management Prototype</h1><div id="sub" class="muted">Free agents and training lab.</div></section>
<div class="grid"><section class="card"><h3>Free Agents</h3><div id="list"></div></section>
<section class="card"><h3>Training Lab</h3>
<label>Wrestler<select id="w"></select></label>
<label>Training Type<select id="type"><option>finisher</option><option>promo</option><option>safety</option></select></label>
<label>Weeks<input id="weeks" type="number" min="1" max="12" value="4"></label>
<label>Coach Skill<input id="skill" type="number" min="1" max="100" value="75"></label>
<button id="run">Apply Training</button> <button id="save">Save Training Prefs</button>
<div id="out" class="muted" style="margin-top:10px"></div><div id="saveMsg" class="ok" style="margin-top:8px"></div></section></div></div>
<script>
const wrestlers=[
{id:'fa_rook_steel',name:'Rook Steel',style:'powerhouse',align:'face',draw:42,crowd:48,danger:62,inj:38,hurt:44,promo:55,fin:'Steelbreaker',finPop:58,safety:56},
{id:'fa_nova_blaze',name:'Nova Blaze',style:'high_flyer',align:'heel',draw:61,crowd:67,danger:71,inj:52,hurt:49,promo:70,fin:'Comet Crash',finPop:75,safety:58},
{id:'fa_mara_voss',name:'Mara Voss',style:'technical',align:'tweener',draw:57,crowd:59,danger:40,inj:28,hurt:22,promo:63,fin:'Voss Lock',finPop:69,safety:83}
];
const list=document.getElementById('list'), sel=document.getElementById('w');
function renderList(){
 list.innerHTML=''; sel.innerHTML='';
 wrestlers.forEach(w=>{
  const d=document.createElement('div'); d.className='t';
  d.innerHTML=`<strong>${w.name}</strong> (${w.align}, ${w.style})<br><span class='muted'>Draw ${w.draw} • Crowd ${w.crowd} • Dangerous ${w.danger} • Injury Prone ${w.inj} • Hurts Others Risk ${w.hurt}<br>Finisher: ${w.fin} (${w.finPop}) • Promo ${w.promo} • Safety ${w.safety}</span>`;
  list.appendChild(d);
  const o=document.createElement('option'); o.value=w.id; o.textContent=w.name; sel.appendChild(o);
 });
}
function runTraining(){
 const id=sel.value; const t=document.getElementById('type').value; const weeks=Number(document.getElementById('weeks').value||1); const skill=Number(document.getElementById('skill').value||1);
 const w=wrestlers.find(x=>x.id===id); if(!w) return;
 const gain=Math.max(1,Math.floor(skill/20)+Math.floor(weeks/2));
 if(t==='finisher'){ w.finPop=Math.min(100,w.finPop+gain); }
 if(t==='promo'){ w.promo=Math.min(100,w.promo+gain); }
 if(t==='safety'){ w.safety=Math.min(100,w.safety+Math.max(1,Math.floor(skill/24)+Math.floor(weeks/3))); w.hurt=Math.max(0,w.hurt-Math.max(1,Math.floor(gain/2))); }
 document.getElementById('out').textContent=`Training applied to ${w.name}.`;
 renderList();
}
function loadProfile(){
 const raw=localStorage.getItem('ringmaster_brand_profile');
 if(!raw) return;
 try{const p=JSON.parse(raw); if(p.brand_name){document.getElementById('sub').textContent=`Talent planning for ${p.brand_name} (${p.country||'US'})`;}
 if(p.last_training_weeks) document.getElementById('weeks').value=p.last_training_weeks;
 if(p.last_training_skill) document.getElementById('skill').value=p.last_training_skill;
 if(p.last_training_type) document.getElementById('type').value=p.last_training_type;
 }catch{}
}
function savePrefs(){
 const raw=localStorage.getItem('ringmaster_brand_profile');
 const p=raw?JSON.parse(raw):{};
 p.last_training_weeks=Number(document.getElementById('weeks').value||4);
 p.last_training_skill=Number(document.getElementById('skill').value||75);
 p.last_training_type=document.getElementById('type').value;
 localStorage.setItem('ringmaster_brand_profile',JSON.stringify(p));
 document.getElementById('saveMsg').textContent='Training preferences saved to brand profile.';
}
document.getElementById('run').addEventListener('click',runTraining); 
document.getElementById('save').addEventListener('click',savePrefs);
renderList();
loadProfile();
</script></body></html>
