<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rookie Quest: Ringmaster — Roster Management v2</title>
  <style>
    :root{--deep:#0B1324;--panel:#171A21;--card:#232734;--border:#2C3140;--gold:#D4AF37;--gold-dark:#9B7A20;--text:#F2F2F2;--muted:#A7B0C0;--green:#37D67A;--amber:#FFB020;--crimson:#C62828;--teal:#19A7A5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#060A12,var(--deep));color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1480px;margin:0 auto;padding:22px}.panel{background:rgba(23,26,33,.94);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.28)}.gold{border-color:rgba(212,175,55,.38)}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(23,26,33,.97),rgba(11,19,36,.95));margin-bottom:14px}h1,h2,h3{margin:0}.title{text-transform:uppercase;letter-spacing:.05em}.title span{color:var(--gold)}.small,.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{cursor:pointer;border-radius:10px;padding:10px 12px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;border:1px solid rgba(212,175,55,.35)}.primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#091018}.secondary{background:var(--card);color:var(--text);border-color:var(--border)}.danger{background:rgba(198,40,40,.18);color:var(--text);border-color:rgba(198,40,40,.6)}.layout{display:grid;grid-template-columns:1fr 430px;gap:14px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select,input,select,textarea{background:#0f131c;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px}.toolbar input{min-width:280px}label{display:block;margin-top:10px;color:var(--muted);font-size:13px}input,select,textarea{width:100%;margin-top:7px}textarea{min-height:76px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wrestler{background:rgba(35,39,52,.72);border:1px solid var(--border);border-radius:14px;padding:14px}.wrestler.selected{border-color:var(--gold);box-shadow:0 0 22px rgba(212,175,55,.12)}.head{display:flex;justify-content:space-between;gap:10px}.name{font-size:20px;font-weight:950}.score{font-size:26px;color:var(--gold);font-weight:1000}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:12px;margin:6px 5px 0 0}.goldpill{border-color:rgba(212,175,55,.42);color:var(--gold);background:rgba(212,175,55,.07)}.bar{height:9px;border:1px solid var(--border);border-radius:99px;overflow:hidden;background:#101620;margin-top:9px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--crimson),var(--amber),var(--gold),var(--teal));width:50%}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.stat{background:rgba(17,21,28,.72);border:1px solid var(--border);border-radius:10px;padding:8px}.stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.stat b{color:var(--text)}.notice{border:1px solid rgba(25,167,165,.32);background:rgba(25,167,165,.08);border-radius:12px;padding:10px;margin-top:10px;color:var(--muted)}.warn{border:1px solid rgba(255,176,32,.32);background:rgba(255,176,32,.08);border-radius:12px;padding:10px;margin-top:10px;color:var(--amber)}@media(max-width:1100px){.layout{grid-template-columns:1fr}.cards,.grid,.statrow{grid-template-columns:1fr}.top,.toolbar{display:block}.actions{margin-top:12px}.toolbar input,.toolbar select{width:100%;margin-top:8px}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="panel top gold">
    <div><h1 class="title">Roster Management <span>v2</span></h1><div class="small">Create and edit wrestlers used by Booking Board v2 and the show simulation.</div></div>
    <div class="actions"><button class="secondary" onclick="location.href='campaign_dashboard.html'">Dashboard</button><button class="secondary" onclick="location.href='booking_board_v2.html'">Booking Board v2</button><button class="secondary" onclick="location.href='roster_momentum.html'">Momentum View</button><button class="primary" id="saveRoster">Save Roster</button></div>
  </section>

  <div class="layout">
    <main class="panel gold">
      <div class="toolbar"><input id="search" placeholder="Search wrestlers..." /><select id="filter"><option value="">All roles</option><option>Main Event</option><option>Upper Card</option><option>Mid Card</option><option>Opener</option><option>Prospect</option><option>Veteran</option><option>Enhancement Talent</option></select><span class="muted" id="count"></span></div>
      <div id="cards" class="cards"></div>
    </main>

    <aside class="panel">
      <h2 style="color:var(--gold)" id="formTitle">Create Wrestler</h2>
      <div class="grid"><label>Name <input id="name" value="New Star"></label><label>Role <select id="role"><option>Main Event</option><option>Upper Card</option><option>Mid Card</option><option>Opener</option><option>Prospect</option><option>Veteran</option><option>Enhancement Talent</option></select></label></div>
      <div class="grid"><label>Alignment <select id="alignment"><option>Face</option><option>Heel</option><option>Tweener</option></select></label><label>Style <select id="style"><option>Powerhouse</option><option>Technical</option><option>Brawler</option><option>High Flyer</option><option>Showbiz Entertainer</option><option>Hardcore</option><option>Comedy</option><option>Striker</option><option>Submission Specialist</option></select></label></div>
      <div class="grid"><label>Preferred Match <select id="preferredMatch"><option>Singles Match</option><option>Tag Team Match</option><option>Triple Threat</option><option>Fatal Four Way</option><option>Ladder Match</option><option>Cage Match</option><option>Hardcore Match</option><option>Iron Match</option><option>Battle Royal</option><option>Squash Match</option></select></label><label>Risk Tolerance <select id="riskTolerance"><option>Low</option><option>Normal</option><option>High</option><option>Reckless</option></select></label></div>
      <h3 style="margin-top:14px;color:var(--gold)">Popularity / Status</h3>
      <div class="grid"><label>Popularity <input id="popularity" type="number" min="0" max="100" value="50"></label><label>Momentum <input id="momentum" type="number" min="0" max="100" value="50"></label><label>Morale <input id="morale" type="number" min="0" max="100" value="70"></label><label>Fatigue <input id="fatigue" type="number" min="0" max="100" value="10"></label></div>
      <h3 style="margin-top:14px;color:var(--gold)">Skills</h3>
      <div class="grid"><label>In-Ring <input id="inRing" type="number" min="0" max="100" value="60"></label><label>Promo <input id="promo" type="number" min="0" max="100" value="60"></label><label>Stamina <input id="stamina" type="number" min="0" max="100" value="60"></label><label>Safety <input id="safety" type="number" min="0" max="100" value="60"></label><label>Charisma <input id="charisma" type="number" min="0" max="100" value="60"></label><label>Star Power <input id="starPower" type="number" min="0" max="100" value="50"></label></div>
      <label>Notes <textarea id="notes">New roster member.</textarea></label>
      <div class="actions" style="margin-top:14px"><button class="primary" id="addUpdate">Add Wrestler</button><button class="secondary" id="newForm">New</button><button class="danger" id="deleteWrestler">Delete</button></div>
      <div class="actions" style="margin-top:10px"><button class="secondary" id="resetDefaults">Reset Default Roster</button></div>
      <div class="notice" id="status">Roster edits stay local until saved.</div>
      <div class="warn">Future sim pass: these skills should feed into match/promo scoring, not just display here.</div>
    </aside>
  </div>
</div>
<script src="js/ringmaster-state.js"></script>
<script>
const State=window.RingmasterState;
let roster=State.getRoster().map(w=>normalize(w));
let selectedIndex=-1;
function clamp(n){return State.clamp(Number(n||0));}
function normalize(w){return {name:w.name||'Unnamed Wrestler',role:w.role||'Mid Card',alignment:w.alignment||'Tweener',style:w.style||'Technical',preferredMatch:w.preferredMatch||'Singles Match',riskTolerance:w.riskTolerance||'Normal',popularity:clamp(w.popularity??50),momentum:clamp(w.momentum??50),morale:clamp(w.morale??70),fatigue:clamp(w.fatigue??10),inRing:clamp(w.inRing??60),promo:clamp(w.promo??60),stamina:clamp(w.stamina??60),safety:clamp(w.safety??60),charisma:clamp(w.charisma??60),starPower:clamp(w.starPower??50),notes:Array.isArray(w.notes)?w.notes:[w.notes||'New roster member.']};}
function momentumState(m){if(m>=85)return'Red Hot';if(m>=70)return'Hot';if(m>=58)return'Rising';if(m>=40)return'Stable';return'Cold'}
function avgSkill(w){return Math.round((w.inRing+w.promo+w.stamina+w.safety+w.charisma+w.starPower)/6)}
function formData(){return normalize({name:document.getElementById('name').value.trim()||'Unnamed Wrestler',role:document.getElementById('role').value,alignment:document.getElementById('alignment').value,style:document.getElementById('style').value,preferredMatch:document.getElementById('preferredMatch').value,riskTolerance:document.getElementById('riskTolerance').value,popularity:document.getElementById('popularity').value,momentum:document.getElementById('momentum').value,morale:document.getElementById('morale').value,fatigue:document.getElementById('fatigue').value,inRing:document.getElementById('inRing').value,promo:document.getElementById('promo').value,stamina:document.getElementById('stamina').value,safety:document.getElementById('safety').value,charisma:document.getElementById('charisma').value,starPower:document.getElementById('starPower').value,notes:document.getElementById('notes').value.split('\n').map(x=>x.trim()).filter(Boolean)});}
function fillForm(w){document.getElementById('name').value=w.name;document.getElementById('role').value=w.role;document.getElementById('alignment').value=w.alignment;document.getElementById('style').value=w.style;document.getElementById('preferredMatch').value=w.preferredMatch;document.getElementById('riskTolerance').value=w.riskTolerance;['popularity','momentum','morale','fatigue','inRing','promo','stamina','safety','charisma','starPower'].forEach(k=>document.getElementById(k).value=w[k]);document.getElementById('notes').value=(w.notes||[]).join('\n');document.getElementById('formTitle').textContent='Edit Wrestler';document.getElementById('addUpdate').textContent='Update Wrestler';}
function clearForm(){selectedIndex=-1;fillForm(normalize({name:'New Star',role:'Prospect',alignment:'Face',style:'Technical',preferredMatch:'Singles Match',riskTolerance:'Normal',popularity:40,momentum:40,morale:70,fatigue:5,inRing:55,promo:50,stamina:60,safety:65,charisma:55,starPower:35,notes:['New roster member.']}));document.getElementById('formTitle').textContent='Create Wrestler';document.getElementById('addUpdate').textContent='Add Wrestler';render();}
function render(){const q=document.getElementById('search').value.toLowerCase().trim();const f=document.getElementById('filter').value;const shown=roster.map((w,i)=>({...w,_i:i})).filter(w=>(!q||JSON.stringify(w).toLowerCase().includes(q))&&(!f||w.role===f));document.getElementById('count').textContent=`${shown.length} shown / ${roster.length} total`;document.getElementById('cards').innerHTML=shown.map(w=>`<article class="wrestler ${w._i===selectedIndex?'selected':''}"><div class="head"><div><div class="name">${w.name}</div><span class="pill goldpill">${w.role}</span><span class="pill">${w.alignment}</span><span class="pill">${w.style}</span></div><div class="score">${avgSkill(w)}</div></div><div class="bar"><span style="width:${w.momentum}%"></span></div><div class="small" style="margin-top:8px">Momentum: ${momentumState(w.momentum)} • Preferred: ${w.preferredMatch} • Risk: ${w.riskTolerance}</div><div class="statrow"><div class="stat"><span>Pop</span><b>${w.popularity}</b></div><div class="stat"><span>Morale</span><b>${w.morale}</b></div><div class="stat"><span>Fatigue</span><b>${w.fatigue}</b></div><div class="stat"><span>Safety</span><b>${w.safety}</b></div></div><div class="actions" style="margin-top:10px"><button class="secondary" data-edit="${w._i}">Edit</button></div></article>`).join('')||'<div class="notice">No wrestlers found.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{selectedIndex=Number(b.dataset.edit);fillForm(roster[selectedIndex]);render();});}
document.getElementById('addUpdate').onclick=()=>{const data=formData();const duplicate=roster.findIndex((w,i)=>w.name.toLowerCase()===data.name.toLowerCase()&&i!==selectedIndex);if(duplicate>=0){document.getElementById('status').textContent='A wrestler with that name already exists. Rename them first.';return;}if(selectedIndex>=0){roster[selectedIndex]=data;document.getElementById('status').textContent=`Updated ${data.name}. Remember to save roster.`;}else{roster.push(data);selectedIndex=roster.length-1;document.getElementById('status').textContent=`Added ${data.name}. Remember to save roster.`;}render();};
document.getElementById('deleteWrestler').onclick=()=>{if(selectedIndex<0){document.getElementById('status').textContent='Select a wrestler first.';return;}const name=roster[selectedIndex].name;roster.splice(selectedIndex,1);clearForm();document.getElementById('status').textContent=`Deleted ${name}. Remember to save roster.`;};
document.getElementById('newForm').onclick=clearForm;
document.getElementById('saveRoster').onclick=()=>{State.setRoster(roster);document.getElementById('status').textContent='Roster saved. Booking Board v2 will use these names.';};
document.getElementById('resetDefaults').onclick=()=>{roster=State.resetRoster().map(w=>normalize(w));clearForm();document.getElementById('status').textContent='Default roster restored and saved.';};
document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);
clearForm();
</script>
</body>
</html>
