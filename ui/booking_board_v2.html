<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rookie Quest: Ringmaster — Booking Board v2</title>
  <style>
    :root{--deep:#0B1324;--panel:#171A21;--card:#232734;--border:#2C3140;--gold:#D4AF37;--gold-dark:#9B7A20;--text:#F2F2F2;--muted:#A7B0C0;--green:#37D67A;--amber:#FFB020;--crimson:#C62828;--teal:#19A7A5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#060A12,var(--deep));color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1440px;margin:0 auto;padding:22px}.panel{background:rgba(23,26,33,.94);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.28)}.gold{border-color:rgba(212,175,55,.38)}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(23,26,33,.97),rgba(11,19,36,.95));margin-bottom:14px}h1,h2,h3{margin:0}.title{text-transform:uppercase;letter-spacing:.05em}.title span{color:var(--gold)}.small,.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{cursor:pointer;border-radius:10px;padding:10px 12px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;border:1px solid rgba(212,175,55,.35)}.primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#091018}.secondary{background:var(--card);color:var(--text);border-color:var(--border)}.danger{background:rgba(198,40,40,.18);color:var(--text);border-color:rgba(198,40,40,.6)}.layout{display:grid;grid-template-columns:1fr 390px;gap:14px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.kpi{background:rgba(35,39,52,.7);border:1px solid var(--border);border-radius:12px;padding:10px}.kpi span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.kpi b{font-size:24px;color:var(--gold)}.card{background:rgba(35,39,52,.72);border:1px solid var(--border);border-radius:14px;padding:12px;margin-top:10px}.seg-head{display:flex;justify-content:space-between;gap:10px}.seg-title{font-size:18px;font-weight:950}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:12px;margin:6px 5px 0 0}.goldpill{border-color:rgba(212,175,55,.42);color:var(--gold);background:rgba(212,175,55,.07)}.riskpill{border-color:rgba(255,176,32,.42);color:var(--amber);background:rgba(255,176,32,.07)}.warn{border:1px solid rgba(255,176,32,.32);background:rgba(255,176,32,.08);color:var(--amber);border-radius:12px;padding:10px;margin-top:10px}.notice{border:1px solid rgba(25,167,165,.32);background:rgba(25,167,165,.08);color:var(--muted);border-radius:12px;padding:10px;margin-top:10px}.intel{border:1px solid rgba(212,175,55,.35);background:rgba(212,175,55,.07);border-radius:14px;padding:12px;margin-bottom:12px}.intel h3{color:var(--gold);font-size:14px;text-transform:uppercase;letter-spacing:.06em}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin-top:10px;color:var(--muted);font-size:13px}input,select{width:100%;margin-top:7px;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0f131c;color:var(--text)}.roster-pick{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.meter{height:11px;border-radius:99px;border:1px solid var(--border);background:#101620;overflow:hidden;margin-top:10px}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--crimson),var(--amber),var(--gold),var(--teal));width:50%}@media(max-width:1050px){.layout{grid-template-columns:1fr}.top{display:block}.actions{margin-top:12px}.kpis,.formgrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="panel top gold">
    <div><h1 class="title">Booking Board <span>v2</span></h1><div class="small" id="meta">Roster-driven booking prototype</div></div>
    <div class="actions"><button class="secondary" onclick="location.href='campaign_dashboard.html'">Dashboard</button><button class="secondary" onclick="location.href='roster_momentum.html'">Roster</button><button class="secondary" onclick="location.href='broadcast_team.html'">Broadcast Team</button><button class="secondary" onclick="location.href='referee_team.html'">Referee Crew</button><button class="secondary" onclick="location.href='production_team.html'">Production</button><button class="primary" id="saveCard">Save Card</button><button class="primary" id="runShow">Run Show</button></div>
  </section>

  <div class="layout">
    <main class="panel gold">
      <div class="kpis"><div class="kpi"><span>Total Runtime</span><b id="runtime">0m</b></div><div class="kpi"><span>Segments</span><b id="segCount">0</b></div><div class="kpi"><span>Risky Matches</span><b id="riskCount">0</b></div><div class="kpi"><span>Unclear Finishes</span><b id="unclearCount">0</b></div></div>
      <div class="intel"><h3>Pre-Show Intel</h3><div class="small" id="intelText">Checking tonight's chatter...</div><div class="actions" style="margin-top:10px"><button class="secondary" id="reactIntel">React</button><button class="secondary" id="ignoreIntel">Ignore</button></div></div>
      <div id="warnings"></div>
      <div id="segments"></div>
    </main>

    <aside class="panel">
      <h2 style="color:var(--gold)">Add Segment</h2>
      <label>Segment name <input id="name" value="Main Event"></label>
      <div class="formgrid"><label>Type <select id="type"><option>Match</option><option>Promo</option><option>Angle</option><option>Video</option><option>Contract Signing</option><option>Sponsor Segment</option></select></label><label>Minutes <input id="mins" type="number" min="1" value="18"></label></div>
      <label>Match type <select id="matchType"><option>Singles Match</option><option>Tag Team Match</option><option>Triple Threat</option><option>Fatal Four Way</option><option>Ladder Match</option><option>Cage Match</option><option>Hardcore Match</option><option>Iron Match</option><option>Battle Royal</option><option>Squash Match</option></select></label>
      <label>Participants</label>
      <div class="roster-pick"><input id="participantPick" list="rosterList" placeholder="Pick from roster"><button class="secondary" id="addParticipant">Add</button></div>
      <input id="participants" placeholder="Participants will appear here, e.g. Raven Blade vs. J. Strike" value="L. Cross vs. Victor Kane">
      <label>Winner / Featured talent <input id="winner" list="rosterList" value="L. Cross"></label>
      <div class="formgrid"><label>Finish <select id="finish"><option>Clean Pinfall</option><option>Clean Submission</option><option>Dirty Pinfall</option><option>Interference</option><option>DQ</option><option>Count-Out</option><option>Ref Mistake</option><option>Time Limit Draw</option><option>No Contest</option><option>Promo Win</option><option>Story Beat</option></select></label><label>Title match? <select id="titleMatch"><option value="false">No</option><option value="true">Yes</option></select></label></div>
      <label>Protect loser? <select id="protectLoser"><option value="false">No</option><option value="true">Yes</option></select></label>
      <button class="primary" id="addSegment" style="width:100%;margin-top:14px">Add Segment</button>
      <div class="actions" style="margin-top:10px"><button class="secondary" id="resetDefault">Reset Default</button><button class="danger" id="clearCard">Clear</button></div>
      <div class="notice" id="staffNote">Staff setup will appear here.</div>
      <div class="warn">Tip: use the roster picker to avoid spelling duplicates and broken momentum tracking.</div>
    </aside>
  </div>
</div>
<datalist id="rosterList"></datalist>
<script src="js/ringmaster-state.js"></script>
<script>
const State=window.RingmasterState;
const defaultSegments=[
  {name:'Opening Video',type:'Video',matchType:'None',participants:'—',mins:3,winner:'—',finish:'Story Beat',titleMatch:false,protectLoser:false},
  {name:'Singles Match',type:'Match',matchType:'Singles Match',participants:'Raven Blade vs. J. Strike',mins:12,winner:'Raven Blade',finish:'Clean Pinfall',titleMatch:false,protectLoser:false},
  {name:'Backstage Segment',type:'Angle',matchType:'None',participants:'Kayla Stone',mins:4,winner:'Kayla Stone',finish:'Story Beat',titleMatch:false,protectLoser:false},
  {name:'Main Event',type:'Match',matchType:'Cage Match',participants:'L. Cross vs. Victor Kane',mins:18,winner:'L. Cross',finish:'Dirty Pinfall',titleMatch:true,protectLoser:true}
];
const intelNames=['Raven Blade','Kayla Stone','L. Cross','Victor Kane','J. Strike','Nova Vale','Brick Atlas','Mara Voltage'];
const intelTypes=[
  {type:'fan_chant',source:'Fan Chatter',headline:'Crowd outside is chanting for {name}.',segment:'Crowd Demand Promo',fan:14,moraleRisk:5},
  {type:'merch',source:'Merch Table',headline:'A {name} shirt has nearly sold out before bell time.',segment:'Merch Buzz Appearance',fan:12,moraleRisk:4},
  {type:'sponsor',source:'Sponsor Note',headline:'A sponsor wants {name} visible on tonight\'s broadcast.',segment:'Sponsor Spotlight Interview',fan:8,moraleRisk:7},
  {type:'social',source:'Social Buzz',headline:'Clips of {name} are trending before the show.',segment:'Trending Talent Angle',fan:13,moraleRisk:5}
];
let card=State.getBookingCard(); if(!Array.isArray(card)||!card.length) card=defaultSegments.map(s=>({...s}));
const roster=State.getRoster();
const profile=State.getBrandProfile(); const staff=State.getStaffSetup();
if(profile) document.getElementById('meta').textContent=`${profile.show_name||'Tonight'} • Week ${State.getWeek()}`;
document.getElementById('rosterList').innerHTML=roster.map(w=>`<option value="${w.name}">${w.role||''}</option>`).join('');
function seededValue(text,min,max){let hash=0;for(let i=0;i<String(text).length;i++)hash=(hash*31+String(text).charCodeAt(i))%100000;return min+(hash%(max-min+1));}
function isBooked(name){return card.some(s=>String(s.participants||'').toLowerCase().includes(String(name).toLowerCase()));}
function makeIntel(){const seed=`${profile?.brand_name||'default'}-${State.getWeek()}-intel`;const item=intelTypes[seededValue(seed,0,intelTypes.length-1)];let name=intelNames[seededValue(seed+'name',0,intelNames.length-1)];let guard=0;while(isBooked(name)&&guard<intelNames.length){name=intelNames[(intelNames.indexOf(name)+1)%intelNames.length];guard++}return {...item,name,headline:item.headline.replace('{name}',name),status:'pending',reacted:false,ignored:false,fanBonus:item.fan,changeRisk:item.moraleRisk};}
let intel=State.getPreShowIntel()||makeIntel();
function runtimeLabel(total){return total>=60?`${Math.floor(total/60)}h ${total%60}m`:`${total}m`}
function warnings(){const total=card.reduce((s,x)=>s+Number(x.mins||0),0);const risky=card.filter(s=>['Ladder Match','Cage Match','Hardcore Match','Battle Royal'].includes(s.matchType)).length;const unclear=card.filter(s=>['Interference','DQ','Count-Out','Ref Mistake','No Contest','Time Limit Draw'].includes(s.finish)).length;const out=[];if(total>150)out.push(`Runtime is over 150 minutes. Broadcast overrun risk is live.`);if(risky>=3)out.push(`Risky match-heavy card: fatigue and medical pressure likely.`);if(unclear>=3)out.push(`Too many unclear finishes may hurt fan trust.`);if(intel.status==='pending'&&!isBooked(intel.name))out.push(`${intel.source}: ${intel.name} is hot tonight but not booked.`);return out;}
function renderIntel(){const booked=isBooked(intel.name);if(booked&&intel.status==='pending')intel.status='already_booked';document.getElementById('intelText').innerHTML=`<strong>${intel.source}:</strong> ${intel.headline}<br>${intel.name} is ${booked?'<span style="color:var(--green);font-weight:900">already booked</span>':'<span style="color:var(--amber);font-weight:900">not currently booked</span>'}. Fan excitement if used: +${intel.fanBonus}. Late-change risk: -${intel.changeRisk}.`;document.getElementById('reactIntel').disabled=booked;State.setPreShowIntel(intel)}
function renderStaff(){const bits=[];if(staff.broadcastTeam?.announcer)bits.push(`Announcer: ${staff.broadcastTeam.announcer.name}`);if(staff.refereeAssignment?.referee)bits.push(`Referee: ${staff.refereeAssignment.referee.name}`);if(staff.productionSetup?.crew)bits.push(`Production: ${staff.productionSetup.crew.name}`);document.getElementById('staffNote').textContent=bits.length?bits.join(' • '):'Staff setup not selected yet.'}
function render(){const total=card.reduce((s,x)=>s+Number(x.mins||0),0);const risky=card.filter(s=>['Ladder Match','Cage Match','Hardcore Match','Battle Royal'].includes(s.matchType)).length;const unclear=card.filter(s=>['Interference','DQ','Count-Out','Ref Mistake','No Contest','Time Limit Draw'].includes(s.finish)).length;document.getElementById('runtime').textContent=runtimeLabel(total);document.getElementById('segCount').textContent=card.length;document.getElementById('riskCount').textContent=risky;document.getElementById('unclearCount').textContent=unclear;document.getElementById('warnings').innerHTML=warnings().map(w=>`<div class="warn">⚠ ${w}</div>`).join('');document.getElementById('segments').innerHTML=card.map((s,i)=>`<article class="card"><div class="seg-head"><div><div class="seg-title">${i+1}. ${s.name}</div><span class="pill">${s.type}</span>${s.matchType&&s.matchType!=='None'?`<span class="pill riskpill">${s.matchType}</span>`:''}<span class="pill">${s.participants}</span><span class="pill goldpill">${s.finish||'Finish n/a'}</span>${s.winner&&s.winner!=='—'?`<span class="pill goldpill">Winner: ${s.winner}</span>`:''}${s.titleMatch?'<span class="pill goldpill">Title</span>':''}${s.protectLoser?'<span class="pill">Protected loser</span>':''}${s.lateChange?'<span class="pill riskpill">Late change</span>':''}</div><div class="actions"><button class="secondary" data-up="${i}">↑</button><button class="secondary" data-down="${i}">↓</button><button class="danger" data-del="${i}">×</button></div></div><div class="meter"><span style="width:${Math.min(100,Math.max(10,Number(s.mins||1)/30*100))}%"></span></div><div class="small" style="margin-top:8px">${s.mins} minutes</div></article>`).join('');document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.up);if(i>0){[card[i-1],card[i]]=[card[i],card[i-1]];render()}});document.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.down);if(i<card.length-1){[card[i+1],card[i]]=[card[i],card[i+1]];render()}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{card.splice(Number(b.dataset.del),1);render()});renderIntel();renderStaff()}
function save(){State.setBookingCard(card);State.setPreShowIntel(intel)}
document.getElementById('addParticipant').onclick=()=>{const pick=document.getElementById('participantPick').value.trim();if(!pick)return;const current=document.getElementById('participants').value.trim();document.getElementById('participants').value=!current||current==='—'?pick:`${current} vs. ${pick}`;document.getElementById('participantPick').value=''};
document.getElementById('addSegment').onclick=()=>{const type=document.getElementById('type').value;card.push({name:document.getElementById('name').value.trim()||'Unnamed Segment',type,matchType:type==='Match'?document.getElementById('matchType').value:'None',participants:document.getElementById('participants').value.trim()||'—',mins:Math.max(1,Number(document.getElementById('mins').value||10)),winner:document.getElementById('winner').value.trim()||'—',finish:document.getElementById('finish').value,titleMatch:document.getElementById('titleMatch').value==='true',protectLoser:document.getElementById('protectLoser').value==='true'});render()};
document.getElementById('reactIntel').onclick=()=>{card.push({name:intel.segment,type:'Promo',matchType:'None',participants:intel.name,mins:6,winner:intel.name,finish:'Promo Win',titleMatch:false,protectLoser:false,lateChange:true,intelReaction:true,intelType:intel.type});intel.status='reacted';intel.reacted=true;intel.ignored=false;render()};
document.getElementById('ignoreIntel').onclick=()=>{intel.status='ignored';intel.ignored=true;intel.reacted=false;render()};
document.getElementById('saveCard').onclick=()=>{save();document.getElementById('staffNote').textContent='Booking card saved.'};
document.getElementById('runShow').onclick=()=>{save();location.href='post_show_report_v2.html'};
document.getElementById('resetDefault').onclick=()=>{card=defaultSegments.map(s=>({...s}));State.clearPreShowIntel();intel=makeIntel();render()};
document.getElementById('clearCard').onclick=()=>{card=[];render()};
render();
</script>
</body>
</html>
