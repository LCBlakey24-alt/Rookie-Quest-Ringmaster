<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rookie Quest: Ringmaster — Referee Crew</title>
  <style>
    :root{--deep:#0B1324;--panel:#171A21;--card:#232734;--border:#2C3140;--gold:#D4AF37;--gold-dark:#9B7A20;--text:#F2F2F2;--muted:#A7B0C0;--teal:#19A7A5;--green:#37D67A;--amber:#FFB020;--crimson:#C62828}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#060A12,var(--deep));color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1320px;margin:0 auto;padding:24px}.panel{background:rgba(23,26,33,.94);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.28)}.gold{border-color:rgba(212,175,55,.38)}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px;background:linear-gradient(135deg,rgba(23,26,33,.97),rgba(11,19,36,.95))}h1,h2,h3{margin:0}.title{text-transform:uppercase;letter-spacing:.05em}.title span{color:var(--gold)}.muted,.small{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{cursor:pointer;border-radius:10px;padding:11px 13px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;border:1px solid rgba(212,175,55,.35)}.primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#091018}.secondary{background:var(--card);color:var(--text);border-color:var(--border)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ref{margin-top:12px;background:rgba(35,39,52,.72);border:1px solid var(--border);border-radius:14px;padding:14px}.ref.selected{border-color:var(--gold);box-shadow:0 0 24px rgba(212,175,55,.12)}.ref-head{display:flex;justify-content:space-between;gap:12px}.name{font-size:18px;font-weight:950}.score{font-size:28px;font-weight:1000;color:var(--gold)}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:12px;margin:7px 6px 0 0}.bar{height:9px;background:#101620;border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--crimson),var(--amber),var(--gold),var(--teal));width:50%}.preview{margin-top:14px}.row{display:flex;justify-content:space-between;border-bottom:1px solid rgba(44,49,64,.75);padding:8px 0}.row b{color:var(--gold)}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{display:block}.actions{margin-top:12px}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="panel top gold">
    <div><h1 class="title">Referee <span>Crew</span></h1><div class="small">Choose the official for tonight. Referees affect match control, finish credibility, chaos, and accidental disasters.</div></div>
    <div class="actions"><button class="secondary" onclick="location.href='campaign_dashboard.html'">Dashboard</button><button class="secondary" onclick="location.href='booking_board.html'">Booking Board</button><button class="primary" id="saveReturn">Save + Return</button></div>
  </section>

  <section class="grid" id="refs"></section>

  <section class="panel preview"><h2 style="color:var(--gold)">Selected Official</h2><div class="row"><span>Referee</span><b id="selectedRef">None</b></div><div class="row"><span>Likely Impact</span><b id="selectedImpact">Choose a ref</b></div><div class="small" id="refNote" style="margin-top:12px">A steady ref protects match quality. A chaotic ref can create memorable moments or ruin the finish.</div></section>
</div>
<script>
  const referees=[
    {id:'r_sandra_steel',name:'Sandra Steel',style:'Senior official',control:88,accuracy:86,toughness:82,drama:42,quirk:'Rarely gets fooled and keeps even messy main events believable.'},
    {id:'r_eddie_quick',name:'Eddie Quickcount',style:'Fast-count specialist',control:62,accuracy:54,toughness:58,drama:86,quirk:'Counts like he has a bus to catch. Great for chaos, risky for credibility.'},
    {id:'r_marta_grit',name:'Marta Grit',style:'Hard-nosed enforcer',control:80,accuracy:74,toughness:92,drama:55,quirk:'Can take a bump and still crawl into position for the finish.'},
    {id:'r_pete_squint',name:'Pete Squint',style:'Unreliable official',control:44,accuracy:38,toughness:46,drama:78,quirk:'Has never met a rope break he could confidently identify.'},
    {id:'r_lena_clear',name:'Lena Clearfall',style:'Technical ref',control:76,accuracy:90,toughness:60,drama:36,quirk:'Excellent with submissions, rope breaks, and complicated finishes.'},
    {id:'r_barry_bump',name:'Barry Bump',style:'Bump magnet',control:55,accuracy:61,toughness:34,drama:94,quirk:'If there is a collision path, Barry is probably standing in it.'}
  ];
  let selected=JSON.parse(localStorage.getItem('ringmaster_referee_assignment')||'{}');selected.refereeId=selected.refereeId||referees[0].id;
  function avg(r){return Math.round((r.control+r.accuracy+r.toughness+(100-Math.max(0,r.drama-55)))/4)}
  function impact(r){if(r.accuracy<50)return 'High bad-call risk';if(r.toughness<45)return 'Ref-bump injury risk';if(r.control>80)return 'Strong match control';if(r.drama>80)return 'High chaos potential';return 'Balanced official'}
  function render(){const root=document.getElementById('refs');root.innerHTML=referees.map(r=>{const score=avg(r);const sel=selected.refereeId===r.id?' selected':'';return `<article class="ref${sel}"><div class="ref-head"><div><div class="name">${r.name}</div><span class="pill">${r.style}</span><span class="pill">${impact(r)}</span></div><div class="score">${score}</div></div><div class="bar"><span style="width:${score}%"></span></div><div class="small" style="margin-top:9px">Control ${r.control} • Accuracy ${r.accuracy} • Toughness ${r.toughness} • Drama ${r.drama}</div><div class="small" style="margin-top:7px">${r.quirk}</div><button class="secondary" data-id="${r.id}" style="margin-top:10px">Select</button></article>`}).join('');const ref=referees.find(r=>r.id===selected.refereeId);document.getElementById('selectedRef').textContent=ref?ref.name:'None';document.getElementById('selectedImpact').textContent=ref?impact(ref):'Choose a ref';document.getElementById('refNote').textContent=ref?ref.quirk:'Choose a ref for tonight.';document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=()=>{selected.refereeId=btn.dataset.id;save(false);render()})}
  function save(){const ref=referees.find(r=>r.id===selected.refereeId);localStorage.setItem('ringmaster_referee_assignment',JSON.stringify({refereeId:selected.refereeId,referee:ref}))}
  document.getElementById('saveReturn').onclick=()=>{save();location.href='booking_board.html'};render();save();
</script>
</body>
</html>
