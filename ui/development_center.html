<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ringmaster — Development Center</title>
<style>
:root{--bg:#050507;--panel:#0d0f14;--card:#121520;--text:#e8ecf3;--muted:#9aa4b6;--primary:#2f7cff;--secondary:#ff2448;--line:rgba(255,255,255,.12);--warn:#ffb020;--ok:#67e8a5}
body{margin:0;background:radial-gradient(circle at top right,#101728 0,var(--bg) 45%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1200px;margin:0 auto;padding:20px}
.top{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;overflow:hidden;margin-bottom:12px}.top::before,.card::before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:linear-gradient(90deg,var(--secondary),var(--primary));}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;position:relative;overflow:hidden}
label{display:block;color:var(--muted);margin-top:10px} input,select{width:100%;margin-top:6px;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0a0d14;color:var(--text)}
button{margin-top:10px;border:0;border-radius:8px;padding:10px 12px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#091018;cursor:pointer}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}.warn{color:var(--warn)}.ok{color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
</style></head><body><div class="wrap">
<section class="top"><h1 style="margin:0">Development Center Prototype</h1><div id="sub" style="color:var(--muted)">Plan prospect growth and readiness outcomes.</div></section>
<div class="grid"><section class="card"><h3>Development Show Setup</h3>
<label>Enable Development Show<select id="enabled"><option value="yes">Yes</option><option value="no">No</option></select></label>
<label>Training Quality (1-100)<input id="quality" type="number" min="1" max="100" value="70"/></label>
<label>Prospect Readiness<input id="readiness" type="number" min="1" max="100" value="45"/></label>
<label>Prospect Loyalty<input id="loyalty" type="number" min="1" max="100" value="68"/></label>
<label>Sign External Free Agent Instead?<select id="external"><option value="no">No</option><option value="yes">Yes</option></select></label>
<div class="actions"><button id="run">Run Week</button><button id="save">Save to Profile</button><button id="openCampaign">Open Campaign</button></div><div id="msg" class="ok" style="margin-top:8px"></div></section>
<section class="card"><h3>Development Report</h3><div id="out">Run simulation.</div></section></div></div>
<script>
function run(){
 const enabled=document.getElementById('enabled').value==='yes';
 const q=Math.max(1,Math.min(100,Number(document.getElementById('quality').value||70)));
 const r=Math.max(1,Math.min(100,Number(document.getElementById('readiness').value||45)));
 const l=Math.max(1,Math.min(100,Number(document.getElementById('loyalty').value||68)));
 const external=document.getElementById('external').value==='yes';
 const cost=enabled?(20000+q*600):0;
 const growth=enabled?Math.max(1,Math.floor(q/20)):0;
 let readiness=Math.min(100,r+growth);
 let loyalty=l;
 let note='Internal pathway protected.';
 if(external){ loyalty=Math.max(0,l-12); note='External signing blocked pathway; prospect loyalty dropped.'; }
 else { loyalty=Math.min(100,l+4); readiness=Math.min(100,readiness+3); }
 document.getElementById('out').innerHTML=`
  <div class='kpi'>Weekly Development Cost: $${cost.toLocaleString()}</div>
  <div class='kpi'>Prospect Readiness: ${r} → ${readiness}</div>
  <div class='kpi'>Prospect Loyalty: ${l} → ${loyalty}</div>
  <div class='kpi ${external?'warn':''}'>${note}</div>
 `;
}
function load(){
 const raw=localStorage.getItem('ringmaster_brand_profile');
 if(!raw) return;
 try{const p=JSON.parse(raw); if(p.brand_name){document.getElementById('sub').textContent=`Development plan for ${p.brand_name} (${p.country||'US'})`;}}
 catch{}
}
function save(){
 const raw=localStorage.getItem('ringmaster_brand_profile');
 const p=raw?JSON.parse(raw):{};
 p.dev_enabled=document.getElementById('enabled').value;
 p.dev_training_quality=Number(document.getElementById('quality').value||70);
 p.dev_prospect_readiness=Number(document.getElementById('readiness').value||45);
 p.dev_prospect_loyalty=Number(document.getElementById('loyalty').value||68);
 p.dev_external_signing=document.getElementById('external').value;
 localStorage.setItem('ringmaster_brand_profile',JSON.stringify(p));
 document.getElementById('msg').textContent='Development settings saved to brand profile.';
}
document.getElementById('run').addEventListener('click',run);
document.getElementById('save').addEventListener('click',save);
document.getElementById('openCampaign').addEventListener('click',()=>window.location.href='campaign_dashboard.html');
load();
</script></body></html>
