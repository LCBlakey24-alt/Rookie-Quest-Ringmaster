<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rookie Quest: Ringmaster — Weekly Planner</title>
  <style>
    :root{--deep:#0B1324;--bg:#11151C;--panel:#171A21;--card:#232734;--border:#2C3140;--gold:#D4AF37;--gold-dark:#9B7A20;--text:#F2F2F2;--muted:#A7B0C0;--teal:#19A7A5;--green:#37D67A;--amber:#FFB020;--crimson:#C62828}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#060A12,var(--deep));color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1260px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.panel{background:rgba(23,26,33,.94);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.28)}.gold{border-color:rgba(212,175,55,.38)}h1,h2{margin:0}.title{text-transform:uppercase;letter-spacing:.05em}.title span{color:var(--gold)}.muted,.msg{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:430px 1fr;gap:14px}label{display:block;margin-top:12px;color:var(--muted);font-size:13px}input{width:100%;margin-top:7px;padding:11px;border-radius:10px;border:1px solid var(--border);background:#0f131c;color:var(--text)}button{cursor:pointer;border-radius:10px;padding:11px 13px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;border:1px solid rgba(212,175,55,.35)}.primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#091018}.secondary{background:var(--card);color:var(--text);border-color:var(--border)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.kpi{background:rgba(35,39,52,.72);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:12px}.kpi b{display:block;color:var(--gold);font-size:22px;margin-bottom:5px}.meter{height:12px;border:1px solid var(--border);background:#101620;border-radius:999px;overflow:hidden;margin-top:10px}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold),var(--crimson));width:40%}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.warning{color:var(--amber)}.good{color:var(--green)}@media(max-width:900px){.grid,.summary{grid-template-columns:1fr}.top{display:block}.top .actions{margin-top:12px}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="panel top gold">
    <div><h1 class="title">Weekly <span>Planner</span></h1><div class="muted">Plan show cadence, PPV load, entrance budget, and fan-trust pressure.</div></div>
    <div class="actions"><button class="secondary" onclick="window.location.href='main_menu.html'">Main Menu</button><button class="secondary" onclick="window.location.href='campaign_dashboard.html'">Dashboard</button><button class="primary" onclick="window.location.href='booking_board.html'">Booking Board</button></div>
  </section>

  <div class="grid">
    <section class="panel">
      <h2 style="color:var(--gold)">Cadence + Production Inputs</h2>
      <label>Weekly Shows <input id="weeklyShows" type="number" min="1" max="7" value="3"></label>
      <label>Monthly PPVs <input id="monthlyPPVs" type="number" min="0" max="4" value="1"></label>
      <label>PPV Entrance Budget <input id="entranceBudget" type="number" min="0" step="1000" value="80000"></label>
      <label>Top Star Demand <input id="topStarDemand" type="number" min="0" step="1000" value="50000"></label>
      <label>PPV Names <input id="ppvNames" value="Neon Collision, Empire Fall"></label>
      <label>PPV Themes <input id="ppvThemes" value="Ladder, Steel Cage"></label>
      <div class="actions"><button class="primary" id="savePlan">Save Planner</button><button class="secondary" id="openCampaign">Open Dashboard</button></div>
      <div class="msg" id="saveMsg"></div>
    </section>
    <section class="panel gold">
      <h2 style="color:var(--gold)">Planning Summary</h2>
      <div class="summary">
        <div class="kpi"><b id="cadenceScore">Stable</b><div id="cadenceOut"></div><div class="meter"><span id="cadenceMeter"></span></div></div>
        <div class="kpi"><b id="entranceScore">Controlled</b><div id="entranceOut"></div><div class="meter"><span id="entranceMeter"></span></div></div>
      </div>
      <div class="kpi"><b>PPV Schedule</b><div id="ppvOut"></div></div>
      <div class="kpi"><b>Producer Note</b><div id="producerNote" class="muted"></div></div>
    </section>
  </div>
</div>
<script>
  const ids=['weeklyShows','monthlyPPVs','entranceBudget','topStarDemand','ppvNames','ppvThemes'];const el=Object.fromEntries(ids.map(i=>[i,document.getElementById(i)]));const outC=document.getElementById('cadenceOut'),outE=document.getElementById('entranceOut'),outP=document.getElementById('ppvOut');
  function render(){const ws=Number(el.weeklyShows.value||0),ppv=Number(el.monthlyPPVs.value||0);const workload=ws>3?(ws-3)*4.5:0;const sat=ppv>1?(ppv-1)*6:0;const total=workload+sat;const trust=-(total*.35).toFixed(2);const budget=Number(el.entranceBudget.value||0),demand=Number(el.topStarDemand.value||0);const delta=budget-demand;const crowd=delta>0?Math.min(6,delta/15000).toFixed(2):'0.00';const morale=delta<0?(-Math.abs(delta)/10000).toFixed(2):'+0.00';const names=el.ppvNames.value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,4);const themes=el.ppvThemes.value.split(',').map(s=>s.trim()).filter(Boolean);const events=names.map((n,i)=>`Week ${i+1}: ${n} (${themes[i]||'Classic'})`);outC.innerHTML=`Cadence penalty: <b class="${total?'warning':'good'}">${total.toFixed(2)}</b><br>Fan trust delta: ${trust}`;outE.innerHTML=`Crowd bonus: +${crowd}<br>Morale delta: ${morale}`;outP.textContent=events.join(' • ')||'No PPVs scheduled';document.getElementById('cadenceScore').textContent=total>12?'Dangerous':total>0?'Pressured':'Stable';document.getElementById('entranceScore').textContent=delta<0?'Underfunded':'Controlled';document.getElementById('cadenceMeter').style.width=`${Math.min(100,20+total*5)}%`;document.getElementById('entranceMeter').style.width=`${Math.min(100,Math.max(15,(budget/Math.max(1,demand))*60))}%`;document.getElementById('producerNote').textContent=total>0?'Reduce show load or PPV saturation before expanding again.':'Cadence is healthy. Use the breathing room to build stronger storylines.';}
  ids.forEach(i=>el[i].addEventListener('input',render));document.getElementById('savePlan').onclick=()=>{const existing=JSON.parse(localStorage.getItem('ringmaster_brand_profile')||'{}');localStorage.setItem('ringmaster_brand_profile',JSON.stringify({...existing,weekly_shows:Number(el.weeklyShows.value||0),monthly_ppvs:Number(el.monthlyPPVs.value||0),ppv_entrance_budget:Number(el.entranceBudget.value||0),top_star_demand:Number(el.topStarDemand.value||0)}));document.getElementById('saveMsg').textContent='Planner saved to local brand profile.'};document.getElementById('openCampaign').onclick=()=>window.location.href='campaign_dashboard.html';render();
</script>
</body>
</html>
