<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ringmaster — Weekly Planner</title>
  <style>
    :root{--bg:#050507;--panel:#0d0f14;--card:#121520;--text:#e8ecf3;--muted:#9aa4b6;--primary:#2f7cff;--secondary:#ff2448;--line:rgba(255,255,255,.12);--ok:#67e8a5}
    body{margin:0;background:radial-gradient(circle at top right,#101728 0,var(--bg) 45%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
    .wrap{max-width:1200px;margin:0 auto;padding:24px}
    .top{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;overflow:hidden;margin-bottom:14px}
    .top::before,.card::before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:linear-gradient(90deg,var(--secondary),var(--primary));}
    .grid{display:grid;grid-template-columns:420px 1fr;gap:16px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;overflow:hidden}
    label{display:block;margin-top:10px;color:var(--muted);font-size:14px}
    input,textarea{width:100%;margin-top:6px;padding:10px;border-radius:8px;border:1px solid var(--line);background:#0a0d14;color:var(--text)}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
    h1,h2{margin:0 0 8px}
    .actions{display:flex;gap:10px;margin-top:12px}
    button{border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--secondary));color:#091018}
    .msg{margin-top:10px;color:var(--ok);font-size:13px;min-height:18px}
  </style>
</head>
<body>
<div class="wrap">
  <section class="top">
    <h1>Weekly Planner Prototype</h1>
    <div id="subtitle" style="color:var(--muted)">Plan this week’s cadence and production risk profile.</div>
  </section>
  <div class="grid">
    <section class="card">
      <h2>Cadence + Entrance Inputs</h2>
      <label>Weekly Shows <input id="weeklyShows" type="number" min="1" max="7" value="3"></label>
      <label>Monthly PPVs <input id="monthlyPPVs" type="number" min="0" max="4" value="1"></label>
      <label>PPV Entrance Budget <input id="entranceBudget" type="number" min="0" step="1000" value="80000"></label>
      <label>Top Star Demand <input id="topStarDemand" type="number" min="0" step="1000" value="50000"></label>
      <label>PPV Names (comma-separated) <input id="ppvNames" value="Neon Collision, Empire Fall"></label>
      <label>PPV Themes (comma-separated) <input id="ppvThemes" value="Ladder, Steel Cage"></label>
      <div class="actions">
        <button id="savePlan">Save Planner to Brand Profile</button>
        <button id="openCampaign">Open Campaign Dashboard</button>
      </div>
      <div class="msg" id="saveMsg"></div>
    </section>
    <section class="card">
      <h2>Planning Summary</h2>
      <div class="kpi" id="cadenceOut"></div>
      <div class="kpi" id="entranceOut"></div>
      <div class="kpi" id="ppvOut"></div>
    </section>
  </div>
</div>
<script>
  const ids = ['weeklyShows','monthlyPPVs','entranceBudget','topStarDemand','ppvNames','ppvThemes'];
  const el = Object.fromEntries(ids.map(i=>[i,document.getElementById(i)]));
  const outC = document.getElementById('cadenceOut');
  const outE = document.getElementById('entranceOut');
  const outP = document.getElementById('ppvOut');

  function render(){
    const ws = Number(el.weeklyShows.value||0), ppv = Number(el.monthlyPPVs.value||0);
    const workload = ws>3 ? (ws-3)*4.5 : 0;
    const sat = ppv>1 ? (ppv-1)*6 : 0;
    const total = workload+sat;
    const trust = -(total*0.35).toFixed(2);

    const budget = Number(el.entranceBudget.value||0), demand = Number(el.topStarDemand.value||0);
    const delta = budget-demand;
    const crowd = delta>0 ? Math.min(6, delta/15000).toFixed(2) : '0.00';
    const morale = delta<0 ? (-Math.abs(delta)/10000).toFixed(2) : '+0.00';

    const names = el.ppvNames.value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,4);
    const themes = el.ppvThemes.value.split(',').map(s=>s.trim()).filter(Boolean);
    const events = names.map((n,i)=>`W${i+1}: ${n} (${themes[i]||'Classic'})`);

    outC.textContent = `Cadence penalty: ${total.toFixed(2)} | Fan trust delta: ${trust}`;
    outE.textContent = `Entrance crowd bonus: +${crowd} | Morale delta: ${morale}`;
    outP.textContent = `PPV schedule: ${events.join(' | ') || 'No PPVs scheduled'}`;
  }

  function loadProfile(){
    const raw = localStorage.getItem('ringmaster_brand_profile');
    if(!raw) return;
    try {
      const p = JSON.parse(raw);
      if (p.brand_name) document.getElementById('subtitle').textContent = `Planning for ${p.brand_name} (${p.country || 'US'})`;
      if (p.weekly_shows) el.weeklyShows.value = p.weekly_shows;
      if (p.monthly_ppvs !== undefined) el.monthlyPPVs.value = p.monthly_ppvs;
      if (p.ppv_entrance_budget) el.entranceBudget.value = p.ppv_entrance_budget;
      if (p.top_star_demand) el.topStarDemand.value = p.top_star_demand;
      if (Array.isArray(p.ppv_names)) el.ppvNames.value = p.ppv_names.join(', ');
      if (Array.isArray(p.ppv_themes)) el.ppvThemes.value = p.ppv_themes.join(', ');
    } catch {}
  }

  function savePlan(){
    const raw = localStorage.getItem('ringmaster_brand_profile');
    const profile = raw ? JSON.parse(raw) : {};
    profile.weekly_shows = Number(el.weeklyShows.value || 0);
    profile.monthly_ppvs = Number(el.monthlyPPVs.value || 0);
    profile.ppv_entrance_budget = Number(el.entranceBudget.value || 0);
    profile.top_star_demand = Number(el.topStarDemand.value || 0);
    profile.ppv_names = el.ppvNames.value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,4);
    profile.ppv_themes = el.ppvThemes.value.split(',').map(s=>s.trim()).filter(Boolean).slice(0,4);
    localStorage.setItem('ringmaster_brand_profile', JSON.stringify(profile));
    document.getElementById('saveMsg').textContent = 'Saved planner settings to brand profile.';
  }

  ids.forEach(i=>el[i].addEventListener('input', render));
  document.getElementById('savePlan').addEventListener('click', savePlan);
  document.getElementById('openCampaign').addEventListener('click', () => window.location.href='campaign_dashboard.html');

  loadProfile();
  render();
</script>
</body>
</html>
