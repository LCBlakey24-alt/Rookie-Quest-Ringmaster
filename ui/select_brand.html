<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rookie Quest: Ringmaster — Select Brand</title>
  <style>
    :root{--deep:#0B1324;--bg:#11151C;--panel:#171A21;--card:#232734;--border:#2C3140;--gold:#D4AF37;--gold-dark:#9B7A20;--text:#F2F2F2;--muted:#A7B0C0;--teal:#19A7A5;--green:#37D67A;--amber:#FFB020;--crimson:#C62828}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#060A12,var(--deep));color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1320px;margin:0 auto;padding:24px}.panel{background:rgba(23,26,33,.94);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.28)}.gold{border-color:rgba(212,175,55,.38)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;background:linear-gradient(135deg,rgba(23,26,33,.96),rgba(11,19,36,.95))}h1{margin:0;text-transform:uppercase;letter-spacing:.05em}.title span{color:var(--gold)}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{cursor:pointer;border-radius:10px;padding:10px 12px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;border:1px solid rgba(212,175,55,.35)}.primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#091018}.secondary{background:var(--card);color:var(--text);border-color:var(--border)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}input,select{background:#0f131c;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:11px}.toolbar input{min-width:280px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:rgba(23,26,33,.92);border:1px solid var(--border);border-radius:16px;padding:15px;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 10%,rgba(212,175,55,.14),transparent 34%);pointer-events:none}.name{font-weight:950;font-size:18px;margin-bottom:7px;text-transform:uppercase;letter-spacing:.03em;position:relative}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:4px 10px;color:var(--muted);font-size:12px;position:relative}.stats{margin:12px 0;font-size:14px;color:var(--muted);line-height:1.6;position:relative}.stats strong{color:var(--text)}.rank{position:absolute;top:14px;right:14px;color:var(--gold);font-size:28px;font-weight:1000}.bar{height:8px;background:#101620;border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold))}@media(max-width:980px){.grid{grid-template-columns:1fr}.top,.toolbar{display:block}.actions{margin-top:12px}.toolbar input,.toolbar select{width:100%;margin-top:8px}}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="panel top gold"><div><h1 class="title">Select a <span>Brand</span></h1><div class="muted">Choose an existing fictional promotion or create your own path to global domination.</div></div><div class="actions"><button class="primary" onclick="window.location.href='brand_creator.html'">Create Custom Brand</button><button class="secondary" onclick="window.location.href='main_menu.html'">Main Menu</button></div></section>
    <section class="panel toolbar"><input id="search" placeholder="Search brand..." /><select id="regionFilter"><option value="">All Regions</option></select><span class="muted" id="count"></span></section>
    <div class="grid" id="grid"></div>
  </div>
<script>
const countries=[{code:'US',name:'United States',region:'North America',pop:333},{code:'CA',name:'Canada',region:'North America',pop:40},{code:'MX',name:'Mexico',region:'North America',pop:129},{code:'BR',name:'Brazil',region:'South America',pop:203},{code:'AR',name:'Argentina',region:'South America',pop:46},{code:'GB',name:'United Kingdom',region:'Europe',pop:68},{code:'DE',name:'Germany',region:'Europe',pop:84},{code:'FR',name:'France',region:'Europe',pop:65},{code:'ES',name:'Spain',region:'Europe',pop:48},{code:'IT',name:'Italy',region:'Europe',pop:59},{code:'JP',name:'Japan',region:'Asia',pop:124},{code:'KR',name:'South Korea',region:'Asia',pop:52},{code:'CN',name:'China',region:'Asia',pop:1410},{code:'IN',name:'India',region:'Asia',pop:1430},{code:'AU',name:'Australia',region:'Oceania',pop:27},{code:'NZ',name:'New Zealand',region:'Oceania',pop:5},{code:'ZA',name:'South Africa',region:'Africa',pop:62},{code:'EG',name:'Egypt',region:'Africa',pop:112},{code:'NG',name:'Nigeria',region:'Africa',pop:227},{code:'AE',name:'United Arab Emirates',region:'Middle East',pop:10}];
const prefixes=['Iron','Neon','Crimson','Titan','Storm','Midnight','Rogue','Solar','Atlas','Phantom'];const suffixes=['Grapple','Ring','Combat','Crown','Slam','Clash','Arena','Circuit','Alliance','Federation'];const pick=(arr,seed)=>arr[[...seed].reduce((a,c)=>a+c.charCodeAt(0),0)%arr.length];
const brands=countries.map((c,idx)=>({id:`brand_${c.code.toLowerCase()}`,name:`${pick(prefixes,c.code+c.name)} ${pick(suffixes,c.name+c.code)}`,country:c.code,region:c.region,quality:Math.max(45,Math.min(95,50+(idx%10)*4)),popularity:Math.max(35,Math.min(95,40+Math.floor(c.pop/20))),budget:200000+c.pop*2500}));
const grid=document.getElementById('grid'),search=document.getElementById('search'),regionFilter=document.getElementById('regionFilter'),count=document.getElementById('count');[...new Set(countries.map(c=>c.region))].sort().forEach(region=>{const opt=document.createElement('option');opt.value=region;opt.textContent=region;regionFilter.appendChild(opt)});
function render(){const q=search.value.toLowerCase().trim(),region=regionFilter.value;const filtered=brands.filter(b=>(!q||b.name.toLowerCase().includes(q))&&(!region||b.region===region));count.textContent=`${filtered.length} brands shown`;grid.innerHTML='';filtered.sort((a,b)=>(b.popularity*.7+b.quality*.3)-(a.popularity*.7+a.quality*.3)).forEach((b,idx)=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="rank">#${idx+1}</div><div class="name">${b.name}</div><span class="pill">${b.region} • ${b.country}</span><div class="stats">Popularity: <strong>${b.popularity}</strong><div class="bar"><span style="width:${b.popularity}%"></span></div>Quality: <strong>${b.quality}</strong><div class="bar"><span style="width:${b.quality}%"></span></div>Budget: <strong>$${b.budget.toLocaleString()}</strong></div><button class="primary" data-id="${b.id}">Select Brand</button>`;card.querySelector('button').onclick=()=>{localStorage.setItem('ringmaster_selected_brand',b.id);localStorage.setItem('ringmaster_brand_profile',JSON.stringify({brand_name:b.name,country:b.country,starting_cash:b.budget,weekly_shows:2,monthly_ppvs:1}));window.location.href='campaign_dashboard.html'};grid.appendChild(card)})}search.addEventListener('input',render);regionFilter.addEventListener('change',render);render();
</script>
</body>
</html>
