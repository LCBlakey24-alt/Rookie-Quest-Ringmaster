<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rookie Quest: Ringmaster — Post-Show Report v2</title>
<style>
:root{--deep:#0B1324;--panel:#171A21;--card:#232734;--border:#2C3140;--gold:#D4AF37;--gold-dark:#9B7A20;--text:#F2F2F2;--muted:#A7B0C0;--green:#37D67A;--amber:#FFB020;--crimson:#C62828;--teal:#19A7A5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#060A12,var(--deep));color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1320px;margin:0 auto;padding:22px}.panel{background:rgba(23,26,33,.94);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.28)}.gold{border-color:rgba(212,175,55,.38)}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(23,26,33,.97),rgba(11,19,36,.95));margin-bottom:14px}h1,h2,h3{margin:0}.title{text-transform:uppercase;letter-spacing:.05em}.title span{color:var(--gold)}.small,.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{cursor:pointer;border-radius:10px;padding:11px 13px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;border:1px solid rgba(212,175,55,.35)}.primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#091018}.secondary{background:var(--card);color:var(--text);border-color:var(--border)}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:14px}.kpi span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}.kpi b{font-size:26px;color:var(--gold)}.layout{display:grid;grid-template-columns:1fr 370px;gap:14px}.seg{background:rgba(35,39,52,.72);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:12px}.seg-head{display:flex;justify-content:space-between;gap:12px}.seg-title{font-size:18px;font-weight:950}.score{font-size:28px;font-weight:1000;color:var(--gold)}.pill,.boost,.penalty{display:inline-block;border-radius:999px;padding:4px 9px;font-size:12px;margin:6px 6px 0 0;border:1px solid var(--border);color:var(--muted)}.boost{border-color:rgba(55,214,122,.35);color:var(--green);background:rgba(55,214,122,.09)}.penalty{border-color:rgba(198,40,40,.45);color:var(--crimson);background:rgba(198,40,40,.12)}.finish,.titlepill{border-color:rgba(212,175,55,.45);color:var(--gold);background:rgba(212,175,55,.07)}.storypill{border-color:rgba(25,167,165,.45);color:var(--teal);background:rgba(25,167,165,.08)}.risk{border-color:rgba(255,176,32,.45);color:var(--amber);background:rgba(255,176,32,.07)}.note,.alert{margin-top:10px;background:rgba(17,21,28,.72);border:1px solid var(--border);border-radius:12px;padding:10px;color:var(--muted);line-height:1.45}.alert.good{border-left:3px solid var(--green)}.alert.warn{border-left:3px solid var(--amber)}.alert.danger{border-left:3px solid var(--crimson)}.alert.info{border-left:3px solid var(--gold)}@media(max-width:1000px){.top{display:block}.actions{margin-top:12px}.layout{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel top gold"><div><h1 class="title">Post-Show <span>Night Report</span></h1><div class="small" id="meta">Reviewing tonight's show</div></div><div class="actions"><button class="secondary" onclick="location.href='booking_board_v2.html'">Edit Card</button><button class="secondary" onclick="location.href='storyline_management.html'">Storylines</button><button class="secondary" onclick="location.href='title_management.html'">Titles</button><button class="secondary" onclick="location.href='show_history.html'">Show History</button><button class="secondary" onclick="location.href='campaign_dashboard.html'">Dashboard</button><button class="primary" id="advanceWeek">Advance Week</button></div></section>
<section class="kpis"><div class="panel kpi"><span>Overall</span><b id="overall">0</b></div><div class="panel kpi"><span>Crowd</span><b id="crowd">--</b></div><div class="panel kpi"><span>Wrestlers</span><b id="wrestlers">0</b></div><div class="panel kpi"><span>Titles</span><b id="titlesKpi">0</b></div><div class="panel kpi"><span>Stories</span><b id="storiesKpi">0</b></div><div class="panel kpi"><span>Net</span><b id="net">$0</b></div></section>
<div class="layout"><main class="panel gold"><h2>Segment Breakdown</h2><div class="small">Segments can now move championships and storylines, not just wrestlers.</div><div id="segments"></div></main><aside><section class="panel"><h2 style="color:var(--gold)">Storyline Outcomes</h2><div id="storyOutcomes"></div></section><section class="panel" style="margin-top:14px"><h2 style="color:var(--gold)">Title Outcomes</h2><div id="titleOutcomes"></div></section><section class="panel" style="margin-top:14px"><h2 style="color:var(--gold)">Consequences</h2><div id="consequences"></div></section><section class="panel" style="margin-top:14px"><h2 style="color:var(--gold)">Roster Movers</h2><div id="movers"></div></section><section class="panel" style="margin-top:14px"><h2 style="color:var(--gold)">Show Quirks</h2><div id="quirks"></div></section></aside></div>
</div>
<script src="js/ringmaster-state.js"></script>
<script src="js/ringmaster-sim.js"></script>
<script>
const State=window.RingmasterState,Sim=window.RingmasterSim,TITLE_KEY='ringmaster_titles',STORY_KEY='ringmaster_storylines';
const defaultTitles=[{id:'world',name:'RQ World Championship',champion:'L. Cross',prestige:68,quality:'TV Ready',defences:2,weeksSinceDefended:1,status:'Active',notes:['The top prize of the company.']},{id:'breakout',name:'RQ Breakout Championship',champion:'Raven Blade',prestige:48,quality:'Indie Belt',defences:1,weeksSinceDefended:2,status:'Active',notes:['Built around rising stars.']},{id:'tag',name:'RQ Tag Team Championship',champion:'Iron Wolves',prestige:44,quality:'Indie Belt',defences:0,weeksSinceDefended:3,status:'Active',notes:['Needs stronger division support.']}];
const defaultStories=[{id:'crown',name:'Crown and Consequences',status:'Hot',type:'Title Feud',participants:'L. Cross vs. Victor Kane',linkedTitleId:'world',linkedTitleName:'RQ World Championship',heat:72,clarity:68,weeksActive:3,payoffWeek:6,payoff:'Title Match',notes:['The challenger keeps finding dirty ways to embarrass the champion.']},{id:'breakout-rise',name:'Breakout Division Pressure',status:'Building',type:'Underdog Rise',participants:'Raven Blade vs. J. Strike',linkedTitleId:'breakout',linkedTitleName:'RQ Breakout Championship',heat:46,clarity:58,weeksActive:2,payoffWeek:5,payoff:'Tournament Final',notes:['The division needs a breakout match to make the title feel important.']}];
function load(key,def){try{const raw=localStorage.getItem(key);const parsed=raw?JSON.parse(raw):null;return Array.isArray(parsed)&&parsed.length?parsed:JSON.parse(JSON.stringify(def))}catch{return JSON.parse(JSON.stringify(def))}}
function save(key,val){localStorage.setItem(key,JSON.stringify(val))}
function clamp(n,min=0,max=100){return Math.max(min,Math.min(max,Math.round(Number(n)||0)))}
function money(n){return `${n>=0?'+':'-'}$${Math.abs(Math.round(n)).toLocaleString()}`}
function qualityBonus(q){return {'Basic Plate':0,'Indie Belt':2,'TV Ready':5,'Premium Championship':9,'Legacy Gold':14}[q]||0}
function joinNotes(...sets){return sets.flat().filter(Boolean).join(' ')}
const profile=State.getBrandProfile(),staff=State.getStaffSetup(),week=State.getWeek();
let card=State.getBookingCard();if(!Array.isArray(card)||!card.length)card=[{name:'No Card Saved',type:'Angle',participants:'Open the booking board to create tonight',mins:5,finish:'Story Beat',matchType:'None'}];
let titles=load(TITLE_KEY,defaultTitles),stories=load(STORY_KEY,defaultStories);const preShowIntel=State.getPreShowIntel();
const announcer=(staff.broadcastTeam&&staff.broadcastTeam.announcer)||{name:'Default Announcer',style:'House voice',hype:60,clarity:60,professionalism:60};
const commentator=(staff.broadcastTeam&&staff.broadcastTeam.commentator)||{name:'Default Commentator',knowledge:60,focus:60,chemistry:60};
const referee=(staff.refereeAssignment&&staff.refereeAssignment.referee)||{name:'Default Referee',control:60,accuracy:60,toughness:60,drama:50};
const production=staff.productionSetup||{crew:{name:'Default Crew',camera:60,timing:60,director:60,cost:0},sponsor:{name:'No Major Sponsor',money:0,pressure:0,mentions:0,fine:0},equipment:{name:'Default Equipment',safety:60,visuals:60,reliability:60,cost:0},timing:{name:'Flexible Slot',fineRisk:10,overtimeFine:0}};
if(profile)document.getElementById('meta').textContent=`${profile.show_name||'Tonight'} • ${profile.country||'US'} • Week ${week}`;
const results=Sim.scoreCard(card,{announcerProfile:announcer,refereeProfile:referee,preShowIntel,productionSetup:production});
const productionShow=Sim.productionShowEffects(card,production);
const overall=Sim.averageScore(results),wrestlerScore=Sim.averageScore(results,s=>s.type==='Match');
const commentary=Sim.clamp((commentator.knowledge*.4)+(commentator.focus*.35)+(commentator.chemistry*.25)+Sim.seededValue(`${commentator.name}${overall}`,-10,10),1,99);
const announcerScore=Sim.clamp((announcer.hype*.45)+(announcer.clarity*.3)+(announcer.professionalism*.25)+Sim.seededValue(`${announcer.name}${card.length}`,-8,8),1,99);
const refereeScore=Sim.clamp((referee.control*.35)+(referee.accuracy*.4)+(referee.toughness*.15)+(100-Math.max(0,referee.drama-55))*.1+Sim.seededValue(`${referee.name}${overall}`,-8,8),1,99);
const productionNet=Number(productionShow.sponsorRevenue||0)-Number(productionShow.productionCost||0)-Number(productionShow.overrunFine||0)-Number(productionShow.sponsorPenalty||0);
const annoyed=[...new Set(results.flatMap(r=>r.announcerEffect.annoyed).concat(results.flatMap(r=>r.refereeEffect.annoyed)))];
const badCalls=results.filter(r=>r.refereeEffect.badCall).length,refBumps=results.filter(r=>r.refereeEffect.refBump).length,refInjuries=results.filter(r=>r.refereeEffect.injury).length;
const productionIncidents=results.filter(r=>r.productionEffect.missedShot).length,equipmentIncidents=results.filter(r=>r.productionEffect.equipmentIssue).length;
const unclearFinishes=results.filter(r=>r.finishEffect.unclear).length,dirtyFinishes=results.filter(r=>r.finishEffect.dirty).length,protectedFinishes=results.filter(r=>r.finishEffect.protectedLoser).length;
const riskyMatches=results.filter(r=>r.matchTypeEffect.risky).length,spectacleMatches=results.filter(r=>r.matchTypeEffect.spectacle).length,injuryRiskTotal=results.reduce((s,r)=>s+Number(r.matchTypeEffect.injuryRisk||0),0);
const titleResults=results.filter(r=>r.segment.titleMatch&&r.segment.titleId).map(r=>{const s=r.segment,t=titles.find(x=>x.id===s.titleId);if(!t)return null;const before=t.champion||'Vacant',winner=s.winner||before,changed=winner&&winner!=='—'&&winner!==before;let delta=r.score>=80?5:r.score>=70?3:r.score>=55?1:-3;if(r.finishEffect.unclear)delta-=2;if(r.finishEffect.dirty)delta-=1;delta+=Math.round(qualityBonus(t.quality)/5);return{titleId:t.id,titleName:t.name,beforeChampion:before,afterChampion:changed?winner:before,winner,changed,retained:!changed,score:r.score,finish:s.finish,prestigeBefore:t.prestige,prestigeAfter:clamp(Number(t.prestige||0)+delta),delta}}).filter(Boolean);
const storyResults=results.filter(r=>r.segment.storylineId).map(r=>{const s=r.segment,story=stories.find(x=>x.id===s.storylineId);if(!story)return null;let heatDelta=r.score>=80?8:r.score>=70?5:r.score>=55?2:-5;let clarityDelta=r.score>=75?4:r.score>=55?1:-4;if(r.finishEffect.unclear)clarityDelta-=4;if(r.finishEffect.dirty)heatDelta+=2;if(s.titleMatch)heatDelta+=2;if(r.matchTypeEffect.spectacle)heatDelta+=3;if(s.type==='Promo')clarityDelta+=2;const heatAfter=clamp(Number(story.heat||0)+heatDelta),clarityAfter=clamp(Number(story.clarity||0)+clarityDelta);let status=story.status;if(heatAfter>=75&&clarityAfter>=60)status='Hot';if(heatAfter>=85&&clarityAfter>=70)status='Payoff Ready';if(heatAfter<40)status='Cooling';return{storylineId:story.id,storylineName:story.name,score:r.score,segmentName:s.name,heatBefore:story.heat,heatAfter,heatDelta,clarityBefore:story.clarity,clarityAfter,clarityDelta,statusBefore:story.status,statusAfter:status}}).filter(Boolean);
const lateChanges=card.filter(s=>s.lateChange).length;
const fallout=Sim.buildFallout({overall,commentary,announcer:announcerScore,referee:refereeScore,preShowIntel,lateChanges,annoyedNames:annoyed,badCalls,refInjuries,productionShow,productionIncidents,equipmentIncidents,unclearFinishes,dirtyFinishes,riskyMatches,injuryRiskTotal});
fallout.cash+=titleResults.reduce((sum,t)=>sum+(t.score>=75?2500:0),0)+storyResults.reduce((sum,s)=>sum+(s.heatDelta>4?1500:0),0);
fallout.notes.push(...titleResults.map(t=>`${t.titleName}: ${t.changed?`${t.afterChampion} became champion`:`${t.beforeChampion} retained`} and prestige moved ${t.prestigeBefore} → ${t.prestigeAfter}.`));
fallout.notes.push(...storyResults.map(s=>`${s.storylineName}: heat ${s.heatBefore} → ${s.heatAfter}, clarity ${s.clarityBefore} → ${s.clarityAfter}.`));
const crowd=overall>=75?'Hot':overall>=55?'Split':'Cold';
document.getElementById('overall').textContent=overall;document.getElementById('crowd').textContent=crowd;document.getElementById('wrestlers').textContent=wrestlerScore;document.getElementById('titlesKpi').textContent=titleResults.length;document.getElementById('storiesKpi').textContent=storyResults.length;document.getElementById('net').textContent=money(productionNet);
document.getElementById('segments').innerHTML=results.map(r=>{const s=r.segment,mt=r.matchTypeEffect,f=r.finishEffect,p=r.productionEffect,ref=r.refereeEffect;const typeBadge=mt.risky?'<span class="penalty">Risky stipulation</span>':mt.spectacle?'<span class="boost">Spectacle</span>':mt.score>0?'<span class="boost">Match type boost</span>':'';const finishBadge=f.unclear?'<span class="penalty">Unclear finish</span>':f.dirty?'<span class="boost">Dirty heat</span>':f.score>0?'<span class="boost">Finish boost</span>':'';const prodBadge=p.missedShot||p.equipmentIssue?'<span class="penalty">Production issue</span>':p.stageSave?'<span class="boost">Presentation boost</span>':'';const refBadge=ref.badCall||ref.injury?'<span class="penalty">Ref issue</span>':ref.refBump?'<span class="boost">Ref bump chaos</span>':'';const titleBadge=s.titleMatch?`<span class="pill titlepill">${s.titleName||'Title Match'}</span>`:'';const storyBadge=s.storylineId?`<span class="pill storypill">${s.storylineName||'Storyline'}</span>`:'';return`<article class="seg"><div class="seg-head"><div><div class="seg-title">${r.index+1}. ${s.name}</div><span class="pill">${s.type}</span>${s.matchType&&s.matchType!=='None'?`<span class="pill risk">${s.matchType}</span>`:''}<span class="pill">${s.participants}</span><span class="pill finish">${s.finish||'Finish n/a'}</span>${s.winner?`<span class="pill finish">Winner: ${s.winner}</span>`:''}${titleBadge}${storyBadge}${s.protectLoser?'<span class="pill">Loser protected</span>':''}${typeBadge}${finishBadge}${prodBadge}${refBadge}</div><div class="score">${r.score}</div></div><div class="note">${joinNotes(r.matchTypeEffect.notes,r.finishEffect.notes,r.announcerEffect.notes,r.refereeEffect.notes,r.productionEffect.notes,r.intelEffect.notes)}</div></article>`}).join('');
document.getElementById('storyOutcomes').innerHTML=storyResults.length?storyResults.map(s=>`<div class="alert ${s.heatDelta>=5?'good':s.heatDelta<0?'warn':'info'}"><strong>${s.storylineName}</strong><br><small>Heat ${s.heatBefore} → ${s.heatAfter} (${s.heatDelta>=0?'+':''}${s.heatDelta})<br>Clarity ${s.clarityBefore} → ${s.clarityAfter} (${s.clarityDelta>=0?'+':''}${s.clarityDelta})<br>Status: ${s.statusBefore} → ${s.statusAfter}</small></div>`).join(''):'<div class="alert info"><small>No storylines advanced tonight.</small></div>';
document.getElementById('titleOutcomes').innerHTML=titleResults.length?titleResults.map(t=>`<div class="alert ${t.changed?'good':'info'}"><strong>${t.titleName}</strong><br><small>${t.changed?`${t.afterChampion} defeated ${t.beforeChampion} to win the title.`:`${t.beforeChampion} retained the title.`}<br>Prestige ${t.prestigeBefore} → ${t.prestigeAfter} (${t.delta>=0?'+':''}${t.delta})</small></div>`).join(''):'<div class="alert info"><small>No championships were defended tonight.</small></div>';
const consequenceList=[];if(overall>=75)consequenceList.push(['good','Strong show','Fan trust and popularity improved.']);else if(overall<55)consequenceList.push(['danger','Weak show','Fan trust dropped.']);if(storyResults.some(s=>s.statusAfter==='Payoff Ready'))consequenceList.push(['good','Payoff ready','A storyline is ready for a major match or reveal.']);if(storyResults.some(s=>s.heatDelta<0))consequenceList.push(['warn','Story cooled','At least one storyline lost heat.']);if(titleResults.some(t=>t.changed))consequenceList.push(['good','New champion crowned','A title change created a major moment.']);if(titleResults.some(t=>t.delta<0))consequenceList.push(['warn','Title prestige damaged','At least one championship came out weaker.']);if(riskyMatches>=3)consequenceList.push(['warn','Risk-heavy card',`${riskyMatches} risky stipulations increased fatigue pressure.`]);if(unclearFinishes)consequenceList.push(['warn','Unclear finishes',`${unclearFinishes} finish(es) damaged story clarity.`]);if(productionNet<0)consequenceList.push(['warn','Production loss',`The show lost $${Math.abs(productionNet).toLocaleString()} through production/sponsor setup.`]);document.getElementById('consequences').innerHTML=(consequenceList.length?consequenceList:[['info','Stable night','No major disaster. Somehow.']]).map(([t,a,b])=>`<div class="alert ${t}"><strong>${a}</strong><br><small>${b}</small></div>`).join('');
const quirks=[];if(storyResults.length)quirks.push(`${storyResults.length} storyline segment(s) moved the long-term booking.`);if(titleResults.length)quirks.push(`${titleResults.length} championship match(es) gave the card stakes.`);if(spectacleMatches)quirks.push(`${spectacleMatches} spectacle match(es) made the show feel bigger.`);if(riskyMatches)quirks.push(`${riskyMatches} risky match(es) pushed the roster harder.`);if(protectedFinishes)quirks.push(`${protectedFinishes} loser(s) were protected for future stories.`);if(badCalls)quirks.push(`${referee.name} caused ${badCalls} questionable call(s).`);if(refBumps)quirks.push(`${referee.name} took ${refBumps} ref bump(s).`);if(equipmentIncidents)quirks.push(`${production.equipment.name} caused ${equipmentIncidents} equipment scare(s).`);if(!quirks.length)quirks.push('Nothing caught fire. This is a win in wrestling production.');document.getElementById('quirks').innerHTML=quirks.map(q=>`<div class="alert info"><small>${q}</small></div>`).join('');
function updateRoster(){const roster=State.getRoster(),changes=[];results.forEach(r=>{const s=r.segment,winner=String(s.winner||'').toLowerCase();Sim.splitParticipants(s.participants).forEach(name=>{let w=roster.find(x=>x.name.toLowerCase()===name.toLowerCase());if(!w){w={name,role:'Unsigned/extra talent',popularity:40,morale:60,fatigue:10,momentum:40,notes:[]};roster.push(w)}const before=w.momentum,isWinner=winner&&name.toLowerCase()===winner;let mom=r.score>=80?7:r.score>=70?4:r.score>=55?1:-4,pop=r.score>=75?2:r.score<50?-1:0,morale=s.lateChange?-2:1,fatigue=s.type==='Match'?Math.max(3,Math.round(Number(s.mins||6)/3)):1;fatigue+=Number(r.matchTypeEffect.fatigue||0);mom+=Number(r.matchTypeEffect.momentum||0);if(isWinner){mom+=r.finishEffect.winnerMomentum||2;pop+=s.titleMatch?3:1;w.notes.push(`${name} won via ${s.finish||'finish'}.`)}else if(s.type==='Match'){mom+=r.finishEffect.loserMomentum||-1;if(s.protectLoser){morale+=2;w.notes.push(`${name} was protected in defeat.`)}}if(s.storylineId)mom+=1;if(s.titleMatch&&isWinner)w.notes.push(`${name} left with championship momentum from ${s.titleName||'a title match'}.`);if(r.matchTypeEffect.risky){morale-=1;w.notes.push(`${name} worked a risky ${s.matchType}.`)}if(r.finishEffect.unclear)morale-=1;if(r.productionEffect.equipmentIssue){mom-=2;morale-=2}w.momentum=State.clamp(w.momentum+mom);w.popularity=State.clamp(w.popularity+pop);w.morale=State.clamp(w.morale+morale+(r.finishEffect.morale||0));w.fatigue=State.clamp(w.fatigue+fatigue);w.notes=[...(w.notes||[]),`Week ${week}: ${s.name} scored ${r.score}. Momentum ${before} → ${w.momentum}.`].slice(-6);changes.push({name,wBefore:before,wAfter:w.momentum,delta:w.momentum-before,state:Sim.momentumState(w.momentum)})})});const sorted=changes.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)).slice(0,8);State.setRoster(roster);State.setLastRosterChanges(sorted);return sorted}
const preview=[];results.forEach(r=>Sim.splitParticipants(r.segment.participants).forEach(name=>{let delta=r.score>=80?7:r.score>=70?4:r.score>=55?1:-4;delta+=Number(r.matchTypeEffect.momentum||0);if(String(r.segment.winner||'').toLowerCase()===name.toLowerCase())delta+=r.finishEffect.winnerMomentum||2;else if(r.segment.type==='Match')delta+=r.finishEffect.loserMomentum||-1;if(r.segment.titleMatch&&String(r.segment.winner||'').toLowerCase()===name.toLowerCase())delta+=2;if(r.segment.storylineId)delta+=1;if(r.finishEffect.unclear)delta-=1;if(r.productionEffect.equipmentIssue)delta-=2;preview.push({name,delta,score:r.score})}));document.getElementById('movers').innerHTML=preview.slice(0,6).map(c=>`<div class="alert ${c.delta>=4?'good':c.delta<0?'warn':'info'}"><strong>${c.name}</strong><br><small>Projected momentum ${c.delta>=0?'+':''}${c.delta} from score ${c.score}.</small></div>`).join('')||'<div class="alert info"><small>No roster movement projected.</small></div>';
function updateTitles(){titleResults.forEach(out=>{const t=titles.find(x=>x.id===out.titleId);if(!t)return;t.champion=out.afterChampion;t.prestige=out.prestigeAfter;t.weeksSinceDefended=0;t.defences=Number(t.defences||0)+1;t.notes=[...(Array.isArray(t.notes)?t.notes:[t.notes||'']),`Week ${week}: ${out.changed?`${out.afterChampion} won from ${out.beforeChampion}`:`${out.beforeChampion} retained`} via ${out.finish}. Prestige ${out.prestigeBefore} → ${out.prestigeAfter}.`].filter(Boolean).slice(-8)});titles.forEach(t=>{if(!titleResults.some(r=>r.titleId===t.id)&&t.status==='Active')t.weeksSinceDefended=Number(t.weeksSinceDefended||0)+1});save(TITLE_KEY,titles)}
function updateStories(){storyResults.forEach(out=>{const s=stories.find(x=>x.id===out.storylineId);if(!s)return;s.heat=out.heatAfter;s.clarity=out.clarityAfter;s.status=out.statusAfter;s.weeksActive=Number(s.weeksActive||0)+1;s.notes=[...(Array.isArray(s.notes)?s.notes:[s.notes||'']),`Week ${week}: ${out.segmentName} scored ${out.score}. Heat ${out.heatBefore} → ${out.heatAfter}, clarity ${out.clarityBefore} → ${out.clarityAfter}.`].filter(Boolean).slice(-8)});stories.forEach(s=>{if(!storyResults.some(r=>r.storylineId===s.id)&&s.status!=='Finished'){s.weeksActive=Number(s.weeksActive||0)+1;if(s.status==='Hot')s.heat=clamp(Number(s.heat||0)-1)}});save(STORY_KEY,stories)}
document.getElementById('advanceWeek').onclick=()=>{const rosterChanges=updateRoster();updateTitles();updateStories();State.applyFallout(fallout);const finishStats={unclearFinishes,dirtyFinishes,protectedFinishes};const matchTypeStats={riskyMatches,spectacleMatches,injuryRiskTotal};const report={overall,wrestler:wrestlerScore,announcer:announcerScore,commentary,referee:refereeScore,productionNet,productionShow,finishStats,matchTypeStats,titleResults,storyResults,crowdMood:crowd,rosterChanges,fallout,refereeIncidents:{badCalls,refBumps,refInjuries},card,week,refereeName:referee.name,announcerName:announcer.name,commentatorName:commentator.name,productionCrewName:production.crew.name,sponsorName:production.sponsor.name};State.setLastShowReport(report);State.addShowHistoryEntry({id:`week-${week}-${Date.now()}`,week,showName:profile?.show_name||'Untitled Show',overall,wrestler:wrestlerScore,announcer:announcerScore,commentary,referee:refereeScore,productionNet,finishStats,matchTypeStats,titleResults,storyResults,crowdMood:crowd,rosterChanges,fallout,refereeIncidents:{badCalls,refBumps,refInjuries},notes:fallout.notes,card});State.clearPreShowIntel();State.advanceWeek();location.href='campaign_dashboard.html'};
</script>
