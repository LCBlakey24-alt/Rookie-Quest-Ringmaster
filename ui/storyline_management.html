<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Rookie Quest: Ringmaster — Storyline Office</title>
<style>
:root{--deep:#0B1324;--panel:#171A21;--card:#232734;--border:#2C3140;--gold:#D4AF37;--gold-dark:#9B7A20;--text:#F2F2F2;--muted:#A7B0C0;--green:#37D67A;--amber:#FFB020;--crimson:#C62828;--teal:#19A7A5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#060A12,var(--deep));color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1480px;margin:0 auto;padding:22px}.panel{background:rgba(23,26,33,.94);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 16px 48px rgba(0,0,0,.28)}.gold{border-color:rgba(212,175,55,.38)}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;background:linear-gradient(135deg,rgba(23,26,33,.97),rgba(11,19,36,.95));margin-bottom:14px}h1,h2,h3{margin:0}.title{text-transform:uppercase;letter-spacing:.05em}.title span{color:var(--gold)}.small,.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{cursor:pointer;border-radius:10px;padding:10px 12px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;border:1px solid rgba(212,175,55,.35)}.primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#091018}.secondary{background:var(--card);color:var(--text);border-color:var(--border)}.danger{background:rgba(198,40,40,.18);color:var(--text);border-color:rgba(198,40,40,.6)}.layout{display:grid;grid-template-columns:1fr 430px;gap:14px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select,input,select,textarea{background:#0f131c;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px}.toolbar input{min-width:280px}label{display:block;margin-top:10px;color:var(--muted);font-size:13px}input,select,textarea{width:100%;margin-top:7px}textarea{min-height:76px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.story{background:rgba(35,39,52,.72);border:1px solid var(--border);border-radius:16px;padding:14px;position:relative;overflow:hidden}.story.selected{border-color:var(--gold);box-shadow:0 0 24px rgba(212,175,55,.13)}.story:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at top right,rgba(212,175,55,.14),transparent 35%);pointer-events:none}.story-head{display:flex;justify-content:space-between;gap:12px;position:relative}.story-name{font-size:20px;font-weight:1000}.heat{font-size:32px;font-weight:1000;color:var(--gold)}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:4px 9px;color:var(--muted);font-size:12px;margin:6px 5px 0 0}.goldpill{border-color:rgba(212,175,55,.42);color:var(--gold);background:rgba(212,175,55,.07)}.warnpill{border-color:rgba(255,176,32,.42);color:var(--amber);background:rgba(255,176,32,.07)}.hotpill{border-color:rgba(55,214,122,.42);color:var(--green);background:rgba(55,214,122,.07)}.bar{height:10px;border:1px solid var(--border);border-radius:99px;overflow:hidden;background:#101620;margin-top:10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--crimson),var(--amber),var(--gold),var(--teal));width:50%}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.stat{background:rgba(17,21,28,.72);border:1px solid var(--border);border-radius:10px;padding:8px}.stat span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.stat b{color:var(--text)}.notice,.warn{border-radius:12px;padding:10px;margin-top:10px;line-height:1.45}.notice{border:1px solid rgba(25,167,165,.32);background:rgba(25,167,165,.08);color:var(--muted)}.warn{border:1px solid rgba(255,176,32,.32);background:rgba(255,176,32,.08);color:var(--amber)}.picker{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}@media(max-width:1100px){.layout{grid-template-columns:1fr}.stories,.grid,.statrow{grid-template-columns:1fr}.top,.toolbar{display:block}.actions{margin-top:12px}.toolbar input,.toolbar select{width:100%;margin-top:8px}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel top gold"><div><h1 class="title">Storyline <span>Office</span></h1><div class="small">Track feuds, heat, clarity, stakes, and planned payoffs.</div></div><div class="actions"><button class="secondary" onclick="location.href='campaign_dashboard.html'">Dashboard</button><button class="secondary" onclick="location.href='booking_board_v2.html'">Booking Board v2</button><button class="secondary" onclick="location.href='title_management.html'">Titles</button><button class="secondary" onclick="location.href='talent_management.html'">Talent</button><button class="primary" id="saveStories">Save Storylines</button></div></section>
<div class="layout">
<main class="panel gold"><div class="toolbar"><input id="search" placeholder="Search storylines..." /><select id="filter"><option value="">All statuses</option><option>Building</option><option>Hot</option><option>Cooling</option><option>Payoff Ready</option><option>Finished</option></select><span class="muted" id="count"></span></div><div id="stories" class="stories"></div></main>
<aside class="panel"><h2 style="color:var(--gold)" id="formTitle">Create Storyline</h2><label>Storyline Name <input id="name" value="Crown and Consequences"></label><div class="grid"><label>Status <select id="status"><option>Building</option><option>Hot</option><option>Cooling</option><option>Payoff Ready</option><option>Finished</option></select></label><label>Type <select id="type"><option>Title Feud</option><option>Personal Grudge</option><option>Faction War</option><option>Underdog Rise</option><option>Respect Rivalry</option><option>Mystery Angle</option><option>Comedy Story</option></select></label></div><label>Participants</label><div class="picker"><input id="participantPick" list="rosterList" placeholder="Pick roster member"><button class="secondary" id="addParticipant">Add</button></div><input id="participants" value="L. Cross vs. Victor Kane"><label>Linked Title <select id="linkedTitle"><option value="">No linked title</option></select></label><div class="grid"><label>Heat <input id="heat" type="number" min="0" max="100" value="55"></label><label>Clarity <input id="clarity" type="number" min="0" max="100" value="60"></label><label>Weeks Active <input id="weeksActive" type="number" min="0" value="1"></label><label>Planned Payoff Week <input id="payoffWeek" type="number" min="1" value="6"></label></div><label>Planned Payoff <select id="payoff"><option>Title Match</option><option>Grudge Match</option><option>Cage Match</option><option>Ladder Match</option><option>Promo Reveal</option><option>Faction Split</option><option>Tournament Final</option></select></label><label>Notes <textarea id="notes">The champion and challenger are circling each other while the crowd chooses a side.</textarea></label><div class="actions" style="margin-top:14px"><button class="primary" id="addUpdate">Add Storyline</button><button class="secondary" id="newForm">New</button><button class="danger" id="deleteStory">Delete</button></div><div class="actions" style="margin-top:10px"><button class="secondary" id="markHot">Mark Hot</button><button class="secondary" id="coolStory">Cool Down</button><button class="secondary" id="readyPayoff">Payoff Ready</button></div><div class="notice" id="statusBox">Storylines save locally for the prototype.</div><div class="warn">Next integration: Booking Board v2 should let segments attach to a storyline, then Night Report v2 should adjust heat and clarity.</div></aside>
</div>
</div>
<datalist id="rosterList"></datalist>
<script src="js/ringmaster-state.js"></script>
<script>
const State=window.RingmasterState, STORY_KEY='ringmaster_storylines', TITLE_KEY='ringmaster_titles';
const defaultStories=[{id:'crown',name:'Crown and Consequences',status:'Hot',type:'Title Feud',participants:'L. Cross vs. Victor Kane',linkedTitleId:'world',linkedTitleName:'RQ World Championship',heat:72,clarity:68,weeksActive:3,payoffWeek:6,payoff:'Title Match',notes:['The challenger keeps finding dirty ways to embarrass the champion.']},{id:'breakout-rise',name:'Breakout Division Pressure',status:'Building',type:'Underdog Rise',participants:'Raven Blade vs. J. Strike',linkedTitleId:'breakout',linkedTitleName:'RQ Breakout Championship',heat:46,clarity:58,weeksActive:2,payoffWeek:5,payoff:'Tournament Final',notes:['The division needs a breakout match to make the title feel important.']}];
const defaultTitles=[{id:'world',name:'RQ World Championship'},{id:'breakout',name:'RQ Breakout Championship'},{id:'tag',name:'RQ Tag Team Championship'}];
function clone(v){return JSON.parse(JSON.stringify(v))}
function loadStories(){try{const raw=localStorage.getItem(STORY_KEY);const parsed=raw?JSON.parse(raw):null;return Array.isArray(parsed)&&parsed.length?parsed:clone(defaultStories)}catch{return clone(defaultStories)}}
function loadTitles(){try{const raw=localStorage.getItem(TITLE_KEY);const parsed=raw?JSON.parse(raw):null;return Array.isArray(parsed)&&parsed.length?parsed:clone(defaultTitles)}catch{return clone(defaultTitles)}}
function saveStories(){localStorage.setItem(STORY_KEY,JSON.stringify(stories))}
function clamp(v,min=0,max=100){return Math.max(min,Math.min(max,Math.round(Number(v)||0)))}
let stories=loadStories(), titles=loadTitles(), selected=-1;
const roster=State.getRoster();
document.getElementById('rosterList').innerHTML=roster.map(w=>`<option value="${w.name}">${w.role||''}</option>`).join('');
document.getElementById('linkedTitle').innerHTML='<option value="">No linked title</option>'+titles.filter(t=>t.status!=='Retired').map(t=>`<option value="${t.id}">${t.name}</option>`).join('');
function storyState(h){if(h>=85)return'White Hot';if(h>=70)return'Hot';if(h>=55)return'Interesting';if(h>=35)return'Warm';return'Cold'}
function normalize(s){return{id:s.id||`story-${Date.now()}`,name:s.name||'Unnamed Storyline',status:s.status||'Building',type:s.type||'Personal Grudge',participants:s.participants||'—',linkedTitleId:s.linkedTitleId||'',linkedTitleName:s.linkedTitleName||'',heat:clamp(s.heat??40),clarity:clamp(s.clarity??50),weeksActive:Math.max(0,Number(s.weeksActive||0)),payoffWeek:Math.max(1,Number(s.payoffWeek||4)),payoff:s.payoff||'Grudge Match',notes:Array.isArray(s.notes)?s.notes:[s.notes||'No notes yet.']}}
function formData(){const titleId=document.getElementById('linkedTitle').value;const title=titles.find(t=>t.id===titleId);return normalize({id:selected>=0?stories[selected].id:`story-${Date.now()}`,name:document.getElementById('name').value.trim(),status:document.getElementById('status').value,type:document.getElementById('type').value,participants:document.getElementById('participants').value.trim(),linkedTitleId:titleId,linkedTitleName:title?title.name:'',heat:document.getElementById('heat').value,clarity:document.getElementById('clarity').value,weeksActive:document.getElementById('weeksActive').value,payoffWeek:document.getElementById('payoffWeek').value,payoff:document.getElementById('payoff').value,notes:document.getElementById('notes').value.split('\n').map(x=>x.trim()).filter(Boolean)})}
function fillForm(s){document.getElementById('name').value=s.name;document.getElementById('status').value=s.status;document.getElementById('type').value=s.type;document.getElementById('participants').value=s.participants;document.getElementById('linkedTitle').value=s.linkedTitleId;document.getElementById('heat').value=s.heat;document.getElementById('clarity').value=s.clarity;document.getElementById('weeksActive').value=s.weeksActive;document.getElementById('payoffWeek').value=s.payoffWeek;document.getElementById('payoff').value=s.payoff;document.getElementById('notes').value=(s.notes||[]).join('\n');document.getElementById('formTitle').textContent=selected>=0?'Edit Storyline':'Create Storyline';document.getElementById('addUpdate').textContent=selected>=0?'Update Storyline':'Add Storyline'}
function clearForm(){selected=-1;fillForm(normalize({name:'New Storyline',status:'Building',type:'Personal Grudge',participants:'—',heat:35,clarity:45,weeksActive:0,payoffWeek:4,payoff:'Grudge Match',notes:['A new story waiting for a spark.']}));render()}
function setStatus(msg){document.getElementById('statusBox').textContent=msg}
function render(){const q=document.getElementById('search').value.toLowerCase().trim();const f=document.getElementById('filter').value;const shown=stories.map((s,i)=>({...normalize(s),_i:i})).filter(s=>(!q||JSON.stringify(s).toLowerCase().includes(q))&&(!f||s.status===f));document.getElementById('count').textContent=`${shown.length} shown / ${stories.length} storylines`;document.getElementById('stories').innerHTML=shown.map(s=>{const near=s.payoffWeek-s.weeksActive;return`<article class="story ${s._i===selected?'selected':''}"><div class="story-head"><div><div class="story-name">${s.name}</div><span class="pill goldpill">${s.type}</span><span class="pill ${s.status==='Hot'||s.status==='Payoff Ready'?'hotpill':s.status==='Cooling'?'warnpill':''}">${s.status}</span>${s.linkedTitleName?`<span class="pill goldpill">${s.linkedTitleName}</span>`:''}</div><div class="heat">${s.heat}</div></div><div class="bar"><span style="width:${s.heat}%"></span></div><div class="small" style="margin-top:8px">${storyState(s.heat)} • Clarity ${s.clarity} • Payoff in ${near<=0?'now':near+' week(s)'}</div><div class="statrow"><div class="stat"><span>People</span><b>${s.participants}</b></div><div class="stat"><span>Weeks</span><b>${s.weeksActive}</b></div><div class="stat"><span>Payoff</span><b>${s.payoff}</b></div><div class="stat"><span>Clarity</span><b>${s.clarity}</b></div></div><div class="notice"><small>${(s.notes||[]).slice(-2).join('<br>')}</small></div><div class="actions" style="margin-top:10px"><button class="secondary" data-edit="${s._i}">Manage</button></div></article>`}).join('')||'<div class="notice">No storylines found.</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.edit);fillForm(normalize(stories[selected]));render()})}
document.getElementById('addParticipant').onclick=()=>{const pick=document.getElementById('participantPick').value.trim();if(!pick)return;const cur=document.getElementById('participants').value.trim();document.getElementById('participants').value=!cur||cur==='—'?pick:`${cur} vs. ${pick}`;document.getElementById('participantPick').value=''};
document.getElementById('addUpdate').onclick=()=>{const data=formData();const duplicate=stories.findIndex((s,i)=>s.name.toLowerCase()===data.name.toLowerCase()&&i!==selected);if(duplicate>=0){setStatus('A storyline with that name already exists.');return}if(selected>=0){stories[selected]=data;setStatus(`Updated ${data.name}. Remember to save.`)}else{stories.push(data);selected=stories.length-1;setStatus(`Added ${data.name}. Remember to save.`)}render()};
document.getElementById('deleteStory').onclick=()=>{if(selected<0){setStatus('Select a storyline first.');return}const name=stories[selected].name;stories.splice(selected,1);clearForm();setStatus(`Deleted ${name}. Save to confirm.`)};
document.getElementById('newForm').onclick=clearForm;
document.getElementById('saveStories').onclick=()=>{saveStories();setStatus('Storylines saved. Booking integration is next.')};
document.getElementById('markHot').onclick=()=>{const s=formData();s.status='Hot';s.heat=clamp(s.heat+8);s.notes.push(`Week ${State.getWeek()}: Storyline heated up.`);if(selected>=0)stories[selected]=s;else{stories.push(s);selected=stories.length-1}fillForm(s);render();setStatus(`${s.name} marked hot.`)};
document.getElementById('coolStory').onclick=()=>{const s=formData();s.status='Cooling';s.heat=clamp(s.heat-8);s.notes.push(`Week ${State.getWeek()}: Storyline cooled down.`);if(selected>=0)stories[selected]=s;else{stories.push(s);selected=stories.length-1}fillForm(s);render();setStatus(`${s.name} cooled down.`)};
document.getElementById('readyPayoff').onclick=()=>{const s=formData();s.status='Payoff Ready';s.heat=clamp(s.heat+4);s.clarity=clamp(s.clarity+4);s.notes.push(`Week ${State.getWeek()}: Storyline marked payoff ready.`);if(selected>=0)stories[selected]=s;else{stories.push(s);selected=stories.length-1}fillForm(s);render();setStatus(`${s.name} is ready for payoff.`)};
document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);
clearForm();
</script>
</body>
</html>
