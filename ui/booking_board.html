<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rookie Quest: Ringmaster — Booking Board</title>
  <style>
    :root { --deep:#0B1324; --bg:#11151C; --panel:#171A21; --card:#232734; --border:#2C3140; --gold:#D4AF37; --gold-dark:#9B7A20; --text:#F2F2F2; --muted:#A7B0C0; --teal:#19A7A5; --green:#37D67A; --amber:#FFB020; --crimson:#C62828; }
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#060A12,var(--deep));color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1380px;margin:0 auto;padding:22px}.panel{background:rgba(23,26,33,.94);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 16px 50px rgba(0,0,0,.28)}.gold{border-color:rgba(212,175,55,.38)}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(23,26,33,.97),rgba(11,19,36,.95))}h1,h2,h3{margin:0}.title{text-transform:uppercase;letter-spacing:.05em}.title span{color:var(--gold)}.muted{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:1fr 350px;gap:14px;margin-top:14px}button{border-radius:10px;padding:10px 12px;font-weight:850;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;border:1px solid rgba(212,175,55,.35)}.primary{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#091018}.secondary{background:var(--card);color:var(--text);border-color:var(--border)}.table{width:100%;border-collapse:separate;border-spacing:0 8px;margin-top:14px}.table th{font-size:11px;color:var(--muted);text-align:left;text-transform:uppercase;letter-spacing:.08em;padding:0 10px}.table td{background:rgba(35,39,52,.72);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:12px 10px}.table td:first-child{border-left:1px solid var(--border);border-radius:12px 0 0 12px;color:var(--gold);font-weight:900}.table td:last-child{border-right:1px solid var(--border);border-radius:0 12px 12px 0}.pill{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:3px 8px;color:var(--muted);font-size:12px}.pace.good{color:var(--green)}.pace.warn{color:var(--amber)}.pace.bad{color:var(--crimson)}input,select{width:100%;margin-top:8px;padding:10px;border-radius:10px;border:1px solid var(--border);background:#0f131c;color:var(--text)}label{display:block;margin-top:12px;color:var(--muted);font-size:13px}.meter{height:12px;border-radius:99px;border:1px solid var(--border);overflow:hidden;background:#101620;margin-top:10px}.meter span{display:block;height:100%;background:linear-gradient(90deg,var(--crimson),var(--amber),var(--gold),var(--teal));width:58%}.warning{margin-top:10px;border-radius:12px;padding:10px;background:rgba(255,176,32,.08);border:1px solid rgba(255,176,32,.32);color:var(--amber);font-size:13px}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}.actions{display:flex;gap:8px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.stat{background:rgba(35,39,52,.7);border:1px solid var(--border);border-radius:12px;padding:10px}.stat b{display:block;font-size:22px;color:var(--gold)}@media(max-width:1000px){.layout{grid-template-columns:1fr}.top{display:block}.actions{margin-top:12px}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="panel top gold">
    <div><h1 class="title">Booking Board / <span>Show Planner</span></h1><div class="muted">Mayhem Tour: Capital Collision • Washington, D.C. • Week 12</div></div>
    <div class="actions"><button class="secondary" onclick="window.location.href='campaign_dashboard.html'">Dashboard</button><button class="secondary" onclick="window.location.href='weekly_planner.html'">Weekly Planner</button><button class="primary" id="saveCard">Save Card</button></div>
  </section>

  <div class="layout">
    <main class="panel gold">
      <div class="summary-grid"><div class="stat"><span class="muted">Show Length</span><b id="totalTime">0m</b></div><div class="stat"><span class="muted">Pacing Grade</span><b id="paceGrade">Good</b></div></div>
      <table class="table"><thead><tr><th>#</th><th>Segment</th><th>Type</th><th>Participants</th><th>Runtime</th><th>Pace</th><th>Move</th></tr></thead><tbody id="segments"></tbody></table>
      <div class="footer"><div><div class="muted">Pace Meter</div><div class="meter"><span id="meterFill"></span></div></div><div id="warnings"></div></div>
    </main>

    <aside class="panel">
      <h2 style="color:var(--gold)">Add Segment</h2>
      <label>Segment name <input id="name" value="Main Event"></label>
      <label>Type <select id="type"><option>Match</option><option>Promo</option><option>Angle</option><option>Video</option><option>Contract Signing</option></select></label>
      <label>Participants <input id="participants" value="L. Cross vs. Victor Kane"></label>
      <label>Minutes <input id="mins" type="number" min="1" value="18"></label>
      <button class="primary" id="add" style="width:100%;margin-top:14px">Add Segment</button>
      <div class="summary-grid"><div class="stat"><span class="muted">Budget</span><b>$138k</b></div><div class="stat"><span class="muted">Target</span><b>150m</b></div></div>
      <div class="warning">Tip: alternate high-energy matches with promos or angles to protect crowd pacing.</div>
    </aside>
  </div>
</div>
<script>
  const segments=[
    {name:'Opening Video',type:'Video',participants:'—',mins:3},
    {name:'The Dynasty Promo',type:'Promo',participants:'Victor Kane',mins:5},
    {name:'Singles Match',type:'Match',participants:'Raven Blade vs. J. Strike',mins:12},
    {name:'Backstage Segment',type:'Angle',participants:'Kayla Stone',mins:4},
    {name:'Tag Team Match',type:'Match',participants:'Iron Wolves vs. High Society',mins:15},
    {name:'Main Event',type:'Match',participants:'L. Cross vs. Victor Kane',mins:18}
  ];
  const segEl=document.getElementById('segments'), totalEl=document.getElementById('totalTime'), warnEl=document.getElementById('warnings'), gradeEl=document.getElementById('paceGrade'), meter=document.getElementById('meterFill');
  function paceImpact(s){if(s.type==='Video')return 0;if(s.type==='Promo'||s.type==='Angle')return Math.max(2,Math.round(s.mins*.8));return Math.max(5,Math.round(s.mins*.9));}
  function warnings(list){const total=list.reduce((a,s)=>a+s.mins,0);const out=[];for(let i=1;i<list.length;i++){if(list[i-1].mins>=20&&list[i].mins>=20){out.push('Two long segments back-to-back may hurt crowd pacing');break}}if(total<60)out.push('Card runtime is short; audience may feel under-served');if(total>180)out.push('Card runtime is very long; fatigue risk increased');return out;}
  function render(){segEl.innerHTML='';segments.forEach((s,idx)=>{const pace=paceImpact(s);const cls=pace>=13?'good':pace>=5?'warn':'bad';const tr=document.createElement('tr');tr.innerHTML=`<td>${idx+1}</td><td><strong>${s.name}</strong></td><td><span class="pill">${s.type}</span></td><td>${s.participants}</td><td>${s.mins}:00</td><td class="pace ${cls}">▲ ${pace}</td><td><button class="secondary" data-up="${idx}">↑</button> <button class="secondary" data-down="${idx}">↓</button></td>`;segEl.appendChild(tr)});const total=segments.reduce((a,s)=>a+s.mins,0);totalEl.textContent=total>=60?`${Math.floor(total/60)}h ${total%60}m`:`${total}m`;const warn=warnings(segments);warnEl.innerHTML=warn.map(w=>`<div class="warning">⚠ ${w}</div>`).join('');gradeEl.textContent=warn.length?'Risky':'Good';gradeEl.style.color=warn.length?'var(--amber)':'var(--green)';meter.style.width=`${Math.min(100,Math.max(18,total/180*100))}%`;segEl.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.up);if(i>0){[segments[i-1],segments[i]]=[segments[i],segments[i-1]];render()}});segEl.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.down);if(i<segments.length-1){[segments[i+1],segments[i]]=[segments[i],segments[i+1]];render()}})}
  document.getElementById('add').onclick=()=>{segments.push({name:document.getElementById('name').value.trim()||'Unnamed Segment',type:document.getElementById('type').value,participants:document.getElementById('participants').value.trim()||'—',mins:Math.max(1,Number(document.getElementById('mins').value||10))});render()};
  document.getElementById('saveCard').onclick=()=>{localStorage.setItem('ringmaster_booking_card',JSON.stringify(segments));alert('Booking card saved to local prototype storage.')};
  render();
</script>
</body>
</html>
