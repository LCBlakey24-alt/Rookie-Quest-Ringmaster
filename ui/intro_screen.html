<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rookie Quest: Ringmaster — Intro</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --text: #e8ecf3;
      --muted: #a7b0c0;
      --accent: #4da3ff;
      --accent2: #37d67a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1a2030 0, var(--bg) 45%);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    .stage {
      width: min(1100px, 94vw);
      padding: 24px;
      border-radius: 20px;
      background: rgba(23,26,33,0.9);
      border: 1px solid #2c3140;
      text-align: center;
      animation: fadein 1.2s ease;
    }
    .presents {
      color: var(--muted);
      letter-spacing: .12em;
      margin-bottom: 16px;
      animation: slidein 1.2s ease;
    }
    .title {
      font-size: clamp(36px, 7vw, 88px);
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg,var(--accent),var(--accent2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: pulse 2.6s infinite;
    }
    .subtitle {
      font-size: clamp(30px, 6vw, 76px);
      margin: 6px 0 10px;
      font-weight: 800;
    }
    .logo {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 20px 0;
      border: 1px solid #2c3140;
    }
    .start-btn {
      cursor: pointer;
      border: 0;
      border-radius: 12px;
      padding: 16px 28px;
      font-size: 20px;
      font-weight: 700;
      color: #08101a;
      background: linear-gradient(135deg,var(--accent),var(--accent2));
      transition: transform .15s ease, filter .15s ease;
    }
    .start-btn:hover { transform: translateY(-2px) scale(1.02); filter: brightness(1.07); }
    .hint { color: var(--muted); margin-top: 12px; font-size: 14px; }
    @keyframes fadein { from { opacity: 0; transform: scale(.98);} to {opacity:1; transform:scale(1);} }
    @keyframes slidein { from {opacity:0; transform: translateY(-12px);} to {opacity:1; transform:translateY(0);} }
    @keyframes pulse { 0%,100% { filter: drop-shadow(0 0 0 rgba(77,163,255,.2)); } 50% { filter: drop-shadow(0 0 12px rgba(77,163,255,.5)); } }
  </style>
</head>
<body>
  <main class="stage">
    <div class="presents">ROOKIE QUEST GAME PRESENTS</div>
    <h1 class="title">ROOKIE QUEST:</h1>
    <div class="subtitle">RINGMASTER</div>
    <img class="logo" src="../assets/branding/ringmaster_logo.svg" alt="Rookie Quest Ringmaster Logo" />
    <div>
      <button id="startBtn" class="start-btn">START GAME</button>
    </div>
    <div class="hint">Prototype intro screen — wire this button to load your game scene.</div>
  </main>

  <script>
    document.getElementById('startBtn').addEventListener('click', () => {
      window.location.href = 'main_menu.html';
    });
  </script>
</body>
</html>
